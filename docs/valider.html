<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="fonts.css">
<title>Valider un nettoyage</title>
<style>
  :root{
    --bg:#ECE9E2; --panel:#F7F5F0; --panel2:#FFFFFF; --ink:#1C1A17; --mut:#6E675D;
    --line:#DAD6CD; --line2:#CDC8BC; --brand:#C83F32; --brand-d:#A9342A; --brandbg:#FAEBE9;
    --ok:#1E7A4B; --okbg:#E4F1E9;
    --disp:'Barlow Condensed',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100dvh;
    display:flex;justify-content:center}
  .wrap{width:100%;max-width:430px;padding:30px 22px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100dvh}
  .hide{display:none!important}
  /* états centrés */
  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .spin{width:40px;height:40px;border:4px solid var(--line2);border-top-color:var(--brand);border-radius:50%;
    animation:sp 1s linear infinite;margin-bottom:12px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .muted{color:var(--mut);font-size:15px}
  /* validation */
  .lead{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.14em;
    font-size:12px;color:var(--mut);text-align:center;margin-bottom:12px}
  .seg{display:flex;gap:11px;margin-bottom:6px}
  .seg button{flex:1;min-height:62px;border-radius:15px;border:1.5px solid var(--line);background:var(--panel2);
    font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.01em;
    font-size:19px;line-height:1;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0 6px}
  .seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .q{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    font-size:20px;color:var(--ink);margin:30px 2px 16px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    min-height:64px;padding:14px 18px;background:var(--panel2);border:1.5px solid var(--line);
    border-radius:15px;font-family:var(--body);text-align:left;cursor:pointer}
  .opt .lbl{font-size:18px;color:var(--ink);font-weight:500}
  .opt .lbl .role{color:var(--mut);font-weight:400}
  .opt .rad{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:#fff}
  .opt.sel{border-color:var(--brand);background:var(--brandbg)}
  .opt.sel .rad{border-color:var(--brand);background:var(--brand);display:grid;place-items:center}
  .opt.sel .rad svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .opt.ext .lbl{display:flex;align-items:center;gap:11px}
  .opt.ext .pic{flex:none;width:26px;height:26px;color:var(--mut)}
  .opt.ext .pic svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin-top:22px;
    background:var(--brand);color:#fff;border:0;border-radius:15px;cursor:pointer;
    font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:20px}
  .cta:disabled{opacity:.4;cursor:default}
  /* confirmation */
  .check{width:132px;height:132px;border-radius:50%;background:var(--okbg);display:grid;place-items:center;margin-bottom:26px}
  .check svg{width:70px;height:70px;stroke:var(--ok);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  h1.done{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:34px;line-height:1;margin:0}
  .time{font-family:var(--disp);font-weight:900;font-size:52px;line-height:1;color:var(--brand);margin:10px 0 0}
  .donemat{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:15px;color:var(--mut);margin-top:16px}
  .err h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:26px;margin:0 0 6px}
  .retry{margin-top:18px;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:15px 22px;
    font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <!-- CHARGEMENT -->
  <div class="mid" id="s-loading">
    <div class="spin"></div>
    <p class="muted">Un instant…</p>
  </div>

  <!-- ERREUR -->
  <div class="mid err hide" id="s-error">
    <h1 id="err-title">Connexion impossible</h1>
    <p class="muted" id="err-msg">Vérifiez votre connexion, puis réessayez.</p>
    <button class="retry" id="err-retry">Réessayer</button>
  </div>

  <!-- VALIDATION -->
  <div class="hide" id="s-validate">
    <div class="lead" id="scope-lead">Quel tatami nettoyé&nbsp;?</div>
    <div class="seg" id="scope-seg"></div>
    <div class="q">Qui a nettoyé&nbsp;?</div>
    <div class="opts" id="who-opts"></div>
    <button class="cta" id="val-go" disabled>Valider</button>
  </div>

  <!-- CONFIRMATION -->
  <div class="mid hide" id="s-done">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <h1 class="done">Nettoyage validé</h1>
    <div class="time" id="done-time">—</div>
    <div class="donemat" id="done-mat"></div>
  </div>

</div>

<script type="module">
/* ---------- Config publique (aucun secret) ---------- */
const CFG = {
  SUPABASE_URL:  'https://enhyrejspgjywnqgmoth.supabase.co',
  SUPABASE_ANON: 'sb_publishable_XpZfOO9EvD9REVqvYoSp4Q_bLY7-MLc',
  TATAMIS: [
    { name:'MAT 1', token:'f96271edff10494cbf325095d50ced74' },
    { name:'MAT 2', token:'1d2895a7cbc84b419244e01e1801f735' },
  ],
};
const ROLE = { coach:'Coach', hygiene_referent:'Référent', club_direction:'Direction', intervenant:'Intervenant' };

const $ = (id)=>document.getElementById(id);
const screens = ['s-loading','s-error','s-validate','s-done'];
const show = (id)=>{ screens.forEach(s=>$(s).classList.add('hide')); $(id).classList.remove('hide'); };
const fail = (t,m)=>{ $('err-title').textContent=t; $('err-msg').textContent=m; show('s-error'); };

const url = new URL(location.href);
const DEMO = url.searchParams.get('demo')==='1';
function zoneToken(){
  const z = url.searchParams.get('z'); if(z) return z;
  const m = url.pathname.match(/\/q\/([^/?#]+)/); return m ? decodeURIComponent(m[1]) : null;
}
const TOKEN = zoneToken();

/* ---------- Planning (rattachement du cours, en arrière-plan) ---------- */
const SCHED={"Lundi":[{"t":"07:00","d":"JJB","m":"MAT 1"},{"t":"11:00","d":"MMA","m":"MAT 1"},{"t":"11:00","d":"Accès libre / Drills","m":"MAT 2"},{"t":"12:30","d":"Lutte","m":"MAT 1"},{"t":"12:30","d":"Boxe pieds-poings","m":"MAT 2"},{"t":"14:00","d":"Compétition","m":"MAT 1"},{"t":"18:00","d":"MMA","m":"MAT 1"},{"t":"18:45","d":"No Gi","m":"MAT 2"},{"t":"19:00","d":"MMA","m":"MAT 1"},{"t":"19:45","d":"Boxe anglaise","m":"MAT 2"},{"t":"20:00","d":"JJB","m":"MAT 1"}],"Mardi":[{"t":"07:00","d":"No Gi","m":"MAT 1"},{"t":"12:30","d":"JJB","m":"MAT 1"},{"t":"12:30","d":"No Gi","m":"MAT 2"},{"t":"18:00","d":"Accès libre / Drills","m":"MAT 1"},{"t":"19:00","d":"Boxe pieds-poings","m":"MAT 1"},{"t":"19:00","d":"JJB","m":"MAT 2"},{"t":"20:00","d":"No Gi","m":"MAT 1"},{"t":"20:00","d":"Boxe anglaise","m":"MAT 2"}],"Mercredi":[{"t":"07:00","d":"JJB","m":"MAT 1"},{"t":"11:00","d":"MMA","m":"MAT 1"},{"t":"11:00","d":"Accès libre / Drills","m":"MAT 2"},{"t":"12:30","d":"No Gi","m":"MAT 1"},{"t":"12:30","d":"Boxe pieds-poings","m":"MAT 2"},{"t":"14:00","d":"Compétition","m":"MAT 1"},{"t":"16:45","d":"Kids","m":"MAT 1"},{"t":"17:30","d":"Kids","m":"MAT 1"},{"t":"18:30","d":"MMA","m":"MAT 1"},{"t":"18:30","d":"No Gi","m":"MAT 2"},{"t":"19:30","d":"JJB","m":"MAT 1"},{"t":"19:30","d":"MMA","m":"MAT 2"},{"t":"20:30","d":"Compétition","m":"MAT 1"}],"Jeudi":[{"t":"07:00","d":"No Gi","m":"MAT 1"},{"t":"12:30","d":"JJB","m":"MAT 1"},{"t":"12:30","d":"No Gi","m":"MAT 2"},{"t":"17:00","d":"Lutte","m":"MAT 1"},{"t":"17:30","d":"Accès libre / Drills","m":"MAT 2"},{"t":"18:45","d":"No Gi","m":"MAT 1"},{"t":"19:00","d":"Boxe pieds-poings","m":"MAT 2"},{"t":"20:00","d":"Sparring","m":"MAT 1"},{"t":"20:00","d":"JJB","m":"MAT 2"}],"Vendredi":[{"t":"07:00","d":"JJB","m":"MAT 1"},{"t":"12:30","d":"No Gi","m":"MAT 1"},{"t":"12:30","d":"Boxe pieds-poings","m":"MAT 2"},{"t":"17:30","d":"Kids No Gi","m":"MAT 1"},{"t":"18:00","d":"JJB","m":"MAT 2"},{"t":"19:00","d":"Sparring","m":"MAT 1"},{"t":"19:00","d":"Boxe pieds-poings","m":"MAT 2"}],"Samedi":[{"t":"10:00","d":"Kids","m":"MAT 1"},{"t":"10:00","d":"JJB","m":"MAT 2"},{"t":"11:00","d":"No Gi Sparring","m":"MAT 1"},{"t":"11:00","d":"MMA","m":"MAT 2"},{"t":"12:00","d":"MMA","m":"MAT 1"},{"t":"13:15","d":"MMA Sparring","m":"MAT 1"}],"Dimanche":[{"t":"11:00","d":"No Gi","m":"MAT 1"},{"t":"11:00","d":"JJB","m":"MAT 2"},{"t":"12:00","d":"Sparring","m":"MAT 1"}]};
const DAYS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const toMin=(t)=>{const p=t.split(':');return (+p[0])*60+(+p[1]);};
function courseForMat(matName){
  const now=new Date(), day=DAYS[now.getDay()], nowm=now.getHours()*60+now.getMinutes();
  const list=(SCHED[day]||[]).filter(c=>c.m===matName).map(c=>({...c,min:toMin(c.t)}));
  const done=list.filter(c=>c.min<=nowm).sort((a,b)=>b.min-a.min);
  const rest=list.filter(c=>c.min>nowm).sort((a,b)=>a.min-b.min);
  const c = done[0]||null; // le cours qui vient de se terminer sur ce tatami ; sinon rien (hors cours)
  return c ? { ref:`${day}|${c.t}|${matName}`, label:c.d, time:c.t } : { ref:null, label:null, time:null };
}

/* ---------- État ---------- */
let CTX=null;            // { zone, club, members }
let isTatami=false;      // la zone scannée est-elle un tatami ?
let scannedMat=null;     // { name, token } si tatami
let scope='both';        // 'both' | 'single'  (uniquement pour tatamis)
let who=null;            // { type:'member', id, name } | { type:'external' }

/* ---------- Appels serveur ---------- */
let _supa=null;
async function supa(){
  if(_supa) return _supa;
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
  _supa = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON, { auth:{ persistSession:true, autoRefreshToken:true } });
  return _supa;
}
async function fn(name, payload){
  const s = await supa();
  const { data:{ session } } = await s.auth.getSession();
  const tok = session?.access_token || CFG.SUPABASE_ANON;
  const res = await fetch(`${CFG.SUPABASE_URL}/functions/v1/${name}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey':CFG.SUPABASE_ANON, 'Authorization':`Bearer ${tok}` },
    body: JSON.stringify(payload||{}),
  });
  let body=null; try{ body=await res.json(); }catch{}
  return { ok:res.ok, status:res.status, body };
}

/* ---------- Rendu ---------- */
function matDisplay(name){ return (name||'').toUpperCase().replace(/\s+/g,' ').trim(); }

function renderValidate(){
  // sélecteur de périmètre (tatamis uniquement)
  const seg = $('scope-seg'); seg.innerHTML='';
  if(isTatami){
    $('scope-lead').classList.remove('hide');
    const both = document.createElement('button'); both.textContent='MAT 1 + MAT 2'; both.dataset.scope='both';
    const one  = document.createElement('button'); one.textContent=matDisplay(scannedMat.name); one.dataset.scope='single';
    seg.append(both, one);
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ scope=b.dataset.scope; paintScope(); }));
    paintScope();
  } else {
    $('scope-lead').classList.add('hide'); scope='single';
  }
  // liste "qui a nettoyé"
  const box = $('who-opts'); box.innerHTML='';
  (CTX.members||[]).forEach(m=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.mid=m.id;
    const role = ROLE[m.role] || m.role || '';
    b.innerHTML=`<span class="lbl">${esc(m.name)}${role?` <span class="role">– ${role}</span>`:''}</span><span class="rad"></span>`;
    b.addEventListener('click',()=>pickWho({type:'member',id:m.id,name:m.name}, b));
    box.appendChild(b);
  });
  const ext=document.createElement('button'); ext.className='opt ext'; ext.dataset.ext='1';
  ext.innerHTML=`<span class="lbl"><span class="pic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></span>Intervenant extérieur</span><span class="rad"></span>`;
  ext.addEventListener('click',()=>pickWho({type:'external'}, ext));
  box.appendChild(ext);
  who=null; $('val-go').disabled=true;
  show('s-validate');
}
function paintScope(){ $('scope-seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.scope===scope)); }
function pickWho(sel, el){
  who=sel;
  $('who-opts').querySelectorAll('.opt').forEach(o=>{ o.classList.remove('sel'); o.querySelector('.rad').innerHTML=''; });
  el.classList.add('sel'); el.querySelector('.rad').innerHTML='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
  $('val-go').disabled=false;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* zones à valider selon le périmètre */
function targetZones(){
  if(isTatami && scope==='both') return CFG.TATAMIS.slice();
  if(isTatami) return [scannedMat];
  return [{ name:CTX.zone.name, token:TOKEN }];
}

/* ---------- Validation ---------- */
$('val-go').addEventListener('click', async ()=>{
  if(!who) return;
  const btn=$('val-go'); btn.disabled=true; btn.textContent='Validation…';
  const zones=targetZones();
  try{
    if(DEMO){
      await new Promise(r=>setTimeout(r,250));
      finishDone(zones, new Date());
      return;
    }
    let last=null;
    for(const z of zones){
      const c=courseForMat(matDisplay(z.name));
      const payload={ zoneToken:z.token, courseRef:c.ref, courseLabel:c.label, courseTime:c.time };
      if(who.type==='external'){ payload.external=true; }
      else { payload.validatorMemberId=who.id; }
      const r=await fn('validation-record', payload);
      if(!(r.ok && r.body?.ok)){
        if(r.status===403) return fail('Non autorisé','Cette personne n’est plus dans la liste. Prévenez le gérant.');
        return fail('Enregistrement impossible','Réessayez dans un instant.');
      }
      last=r.body;
    }
    const t=new Date(last?.validation?.validated_at||Date.now());
    finishDone(zones, t);
  }catch(e){
    fail('Connexion impossible','Le nettoyage n’a pas pu être enregistré. Réessayez.');
  }finally{ btn.textContent='Valider'; }
});
function finishDone(zones, t){
  const hh=('0'+t.getHours()).slice(-2), mm=('0'+t.getMinutes()).slice(-2);
  $('done-time').textContent=`${hh}h${mm}`;
  $('done-mat').textContent=zones.map(z=>matDisplay(z.name)).join(' + ');
  show('s-done');
}

/* ---------- Démarrage ---------- */
async function start(){
  show('s-loading');
  if(!TOKEN && !DEMO){ return fail('QR invalide','Ce lien ne correspond à aucune zone. Scannez le QR collé sur le tatami.'); }

  if(DEMO){
    scannedMat = CFG.TATAMIS.find(t=>t.token===TOKEN) || CFG.TATAMIS[0];
    isTatami=true;
    CTX={ zone:{ name:scannedMat.name }, club:{ name:'Le Cube Fight Club' },
      members:[{id:'1',name:'Thierry',role:'coach'},{id:'2',name:'Lucas',role:'coach'},{id:'3',name:'Rémi',role:'coach'}] };
    return renderValidate();
  }

  try{
    const s=await supa();
    let { data:{ session } }=await s.auth.getSession();
    if(!session){ const { error }=await s.auth.signInAnonymously(); if(error) return fail('Service indisponible','Réessayez dans un instant.'); }
    const r=await fn('q-context',{ zoneToken:TOKEN });
    if(r.status===404) return fail('Zone inconnue','Ce QR ne correspond à aucune zone active.');
    if(!r.ok || !r.body) return fail('Service indisponible','Réessayez dans un instant.');
    CTX=r.body;
    const match=CFG.TATAMIS.find(t=>t.token===TOKEN);
    isTatami = !!match || /tatami/i.test(CTX.zone?.type||'') || /mat/i.test(CTX.zone?.name||'');
    scannedMat = match || { name:CTX.zone.name, token:TOKEN };
    renderValidate();
  }catch(e){ fail('Connexion impossible','Vérifiez votre connexion, puis réessayez.'); }
}
$('err-retry').addEventListener('click', start);
start();
</script>
</body>
</html>
