/* ------------------------------ Journal d'activité (audit) ------------------------------ */
var AUDIT_LABELS={
  'operation.validate':'Opération validée','operation.extra':'Passage supplémentaire',
  'attention.create':'Point d’attention créé','attention.in_progress':'Point pris en charge','attention.corrected':'Correction effectuée','attention.verified':'Point vérifié','attention.closed':'Point clôturé',
  'control.plan':'Contrôle planifié','control.complete':'Contrôle réalisé',
  'zone.create':'Zone créée','zone.update':'Zone modifiée','zone.deactivate':'Zone désactivée','zone.delete':'Zone supprimée',
  'action.create':'Action créée','action.update':'Action modifiée','action.deactivate':'Action désactivée','action.delete':'Action supprimée',
  'schedule.create':'Planification créée','schedule.update':'Planification modifiée','schedule.deactivate':'Planification suspendue','schedule.delete':'Planification supprimée'
};
function auditLabel(a){ return AUDIT_LABELS[a]||a; }
function openJournal(){
  var log=(STATE.records.audit||[]);
  var rows='',last='';
  log.slice(0,150).forEach(function(e){ var dl=dayLabel(e.at); if(dl!==last){rows+='<div class="tl-day">'+dl+'</div>'; last=dl;}
    rows+='<div class="tl-item" style="cursor:default"><span class="tl-rail">'+timeFmt(e.at)+'</span><span class="tl-mid"><span class="n"></span></span>'+
      '<span class="tl-body"><span class="tl-t">'+esc(auditLabel(e.action))+'</span><span class="tl-d">'+esc(e.detail||'')+'</span><span class="tl-by">'+esc(e.userName||'')+'</span></span></div>'; });
  var body = log.length
    ? '<p class="pintro" style="margin:2px 0 10px">Chaque action importante est horodatée et reliée à la personne qui l’a effectuée. Ce journal, non modifiable, prépare la future base de données.</p><div class="tl">'+rows+'</div>'
    : emptyBox('Journal vide','Les actions réalisées apparaîtront ici.');
  openSheet('Traçabilité','Journal d’activité', body, '<button class="btn ghost" id="jClose" style="border:1px solid var(--line-2)">Fermer</button>');
  $('#jClose').onclick=closeSheet;
}

/* ------------------------------ Bilan ------------------------------ */
function genBilan(){
  var occ=todayOccurrences(), doneToday=0; occ.forEach(function(o){if(occDone(o.task,o.slot))doneToday++;});
  var ops30=db.ops.length, anosClosed=db.anos.filter(function(a){return a.status==='closed';}).length, anosOpen=openAnos().length, fig=db.fighter.length;
  var month=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return {
    month:month,
    blocks:[
      {t:'Merci pour votre engagement', p:'Merci d’avoir fait vivre la démarche MATSAFE ce mois-ci. En tenant votre registre au quotidien, '+STATE.club.name+' contribue à un environnement plus sain pour ses pratiquants.'},
      {t:'Votre mois en bref', p:ops30+' opérations tracées, '+anosClosed+' point'+(anosClosed>1?'s':'')+' d’attention traité'+(anosClosed>1?'s':'')+', '+fig+' retour'+(fig>1?'s':'')+' Fighter reçus.'},
      {t:'Points forts', list:[
        'Registre alimenté régulièrement.',
        (anosClosed?'Points d’attention pris en charge et clôturés.':'Peu de points d’attention — bonne maîtrise.')
      ]},
      {t:'Points à consolider', list: anosOpen? ['Quelques points d’attention restent ouverts : les clôturer maintient la dynamique.'] : ['Aucun axe majeur ce mois-ci — le fonctionnement est maîtrisé.']},
      {t:'Suggestion MATSAFE', list:['Continuer à valider les opérations dès qu’elles sont faites : c’est ce qui donne toute sa valeur au registre.']},
      {t:'Message de clôture', p:'Le label reconnaît le travail accompli. Ce bilan sert à maintenir la dynamique, jamais à sanctionner. MATSAFE reste à vos côtés.'}
    ]
  };
}
function openBilan(){
  var b=genBilan();
  var body=b.blocks.map(function(bl){ var inner=bl.list?'<ul style="margin:6px 0 0;padding-left:18px">'+bl.list.map(function(x){return '<li style="font-size:13.5px;line-height:1.5;margin:3px 0">'+esc(x)+'</li>';}).join('')+'</ul>':'<p style="margin:5px 0 0;font-size:14px;line-height:1.55;color:var(--ink)">'+esc(bl.p)+'</p>';
    return '<div style="padding:14px 0;border-top:1px solid var(--line)"><div style="font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:var(--brand)">'+esc(bl.t)+'</div>'+inner+'</div>';
  }).join('');
  openSheet('Bilan MATSAFE · '+esc(b.month), 'Votre bilan', body,
    '<div class="btnrow"><button class="btn ghost" id="blClose" style="border:1px solid var(--line-2)">Fermer</button><button class="btn brand" id="blPrint">Imprimer / PDF</button></div>');
  $('#blClose').onclick=closeSheet;
  $('#blPrint').onclick=function(){
    $('#printArea').innerHTML='<div class="rp-brand">MATSAFE CLUB</div><h2>Bilan mensuel — '+esc(b.month)+'</h2><div class="meta">'+esc(STATE.club.name)+' · '+esc(STATE.club.city||'')+'</div>'+
      b.blocks.map(function(bl){var inner=bl.list?'<ul>'+bl.list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p class="bp">'+esc(bl.p)+'</p>'; return '<div class="bt">'+esc(bl.t)+'</div>'+inner;}).join('');
    window.print();
  };
}

/* ------------------------------ Export ------------------------------ */
function openExport(){
  var now=new Date(); var d7=new Date(now.getTime()-6*864e5), d30=new Date(now.getTime()-29*864e5);
  openSheet('Registre','Exporter le registre',
    '<div class="fieldlab" style="margin-top:8px">Période</div><div class="choices" id="exP">'+
    '<button class="choice sel" data-p="7">7 derniers jours</button><button class="choice" data-p="30">30 derniers jours</button><button class="choice" data-p="all">Tout</button></div>'+
    '<p class="pintro" style="margin-top:14px">Génère un document imprimable (opérations, points d’attention, contrôles) pour la période choisie. Choisissez « Enregistrer au format PDF » dans la boîte d’impression.</p>',
    '<button class="btn" id="exGo">Générer</button>');
  $('#exGo').onclick=function(){ var p=($('.choice.sel',$('#exP'))||{dataset:{p:'7'}}).dataset.p; var from, label;
    if(p==='7'){from=d7.getTime(); label='7 derniers jours';} else if(p==='30'){from=d30.getTime(); label='30 derniers jours';} else {from=0; label='Historique complet';}
    buildAndPrint(from, now.getTime(), label); };
}
function buildAndPrint(from,to,label){
  var ops=db.ops.filter(function(o){return o.at>=from&&o.at<=to;}).sort(function(a,b){return a.at-b.at;});
  var anos=db.anos.filter(function(a){return a.at>=from&&a.at<=to;}).sort(function(a,b){return a.at-b.at;});
  var ctls=db.ctls.filter(function(c){return (c.completedAt&&c.completedAt>=from)||(c.status!=='completed'&&c.due>=from&&c.due<=to);});
  function row(cells){return '<tr>'+cells.map(function(c){return '<td style="padding:6px 8px;border-bottom:1px solid #ddd;font-size:12px;vertical-align:top">'+c+'</td>';}).join('')+'</tr>';}
  var opsT=ops.length?'<table style="width:100%;border-collapse:collapse"><tr>'+['Date','Heure','Zone','Opération','Par','Résultat'].map(function(h){return '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid #111;font-size:11px;text-transform:uppercase">'+h+'</th>';}).join('')+'</tr>'+ops.map(function(o){return row([new Date(o.at).toLocaleDateString('fr-FR'),timeFmt(o.at),esc(o.zone||''),esc(opActionFull(o))+(o.slot?' · '+o.slot:'')+(o.extra?' · suppl.':''),esc(o.by||''),o.anomaly?'Anomalie':'Conforme']);}).join('')+'</table>':'<p style="color:#666">Aucune opération.</p>';
  var anoT=anos.length?'<table style="width:100%;border-collapse:collapse"><tr>'+['Date','Zone','Nature','Description','Statut'].map(function(h){return '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid #111;font-size:11px;text-transform:uppercase">'+h+'</th>';}).join('')+'</tr>'+anos.map(function(a){return row([new Date(a.at).toLocaleDateString('fr-FR'),esc(a.zone),catName(a.cat),esc(a.desc),anoStatusLabel(a.status)]);}).join('')+'</table>':'<p style="color:#666">Aucun point d’attention.</p>';
  var ctlT=ctls.length?'<table style="width:100%;border-collapse:collapse"><tr>'+['Échéance','Contrôle','Zone','Statut'].map(function(h){return '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid #111;font-size:11px;text-transform:uppercase">'+h+'</th>';}).join('')+'</tr>'+ctls.map(function(c){return row([new Date(c.completedAt||c.due).toLocaleDateString('fr-FR'),ctlName(c.type),esc(c.zone||'—'),ctlStatus(c)[1]]);}).join('')+'</table>':'<p style="color:#666">Aucun contrôle.</p>';
  $('#printArea').innerHTML='<div class="rp-brand">MATSAFE CLUB</div><h2>Registre — '+esc(label)+'</h2><div class="meta">'+esc(STATE.club.name)+' · '+esc(STATE.club.city||'')+' · édité le '+new Date().toLocaleDateString('fr-FR')+'</div>'+
    '<div class="bt">Opérations d’hygiène</div>'+opsT+'<div class="bt">Points d’attention</div>'+anoT+'<div class="bt">Contrôles</div>'+ctlT;
  closeSheet(); window.print();
}
