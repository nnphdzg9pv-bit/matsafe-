<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatSafe Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FBFAF7;
    --ink:#16150F; --ink-2:#605B52; --faint:#928C81;
    --line:#E7E3DB; --line-2:#DBD6CC;
    --brand:#C83830; --brand-strong:#AE2E23; --brand-soft:#FBECE9;
    --good:#2E6B4E; --good-soft:#E9F1EC;
    --warn:#8F5410; --warn-soft:#F5EBD9;
    --info:#3A4A66; --info-soft:#E7E9F0;
    --radius:24px; --radius-sm:16px; --radius-xs:12px; --radius-pill:999px;
    --shadow:0 1px 2px rgba(22,21,15,.04), 0 10px 26px -18px rgba(22,21,15,.20);
    --shadow-lg:0 2px 6px rgba(22,21,15,.06), 0 30px 60px -30px rgba(22,21,15,.30);
    --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --sans:"Barlow","Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; font-family:var(--sans); color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden}
  img{max-width:100%}
  [hidden]{display:none!important}
  h1,h2,h3{margin:0}
  button{font-family:inherit; color:inherit}
  ::selection{background:var(--brand); color:#fff}

  /* ---------------- App frame ---------------- */
  .app{display:flex; flex-direction:column; min-height:100dvh}
  .shell{display:flex; flex:1 1 auto; min-height:0}

  /* mobile top header */
  .mtop{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px calc(12px); position:sticky; top:0; z-index:20; background:rgba(244,243,239,.86); backdrop-filter:saturate(1.1) blur(8px)}
  .mtop .brand{display:flex; align-items:center; gap:9px}
  .mtop .mark{height:20px}
  .mtop .role{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.10em; font-size:11px; color:var(--brand); border-left:1px solid var(--line-2); padding-left:9px}
  .iconbtn{appearance:none; border:1px solid var(--line-2); background:var(--surface); width:38px;height:38px;border-radius:12px; display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .iconbtn:active{transform:scale(.96)}

  /* sidebar (desktop) */
  .sidebar{flex:none; width:262px; background:var(--surface); border-right:1px solid var(--line); padding:24px 18px 18px; display:flex; flex-direction:column; gap:3px; position:sticky; top:0; height:100dvh}
  .sb-brand{display:flex; align-items:center; gap:10px; padding:2px 8px 4px}
  .sb-brand .mark{height:24px}
  .sb-brand .role{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.10em; font-size:11px; color:var(--brand); border-left:1px solid var(--line-2); padding-left:9px}
  .sb-baseline{font-size:11px; color:var(--faint); padding:0 8px 14px; line-height:1.35}
  .addbtn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; margin:0 0 14px; cursor:pointer;
    font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:14px;
    padding:13px; border-radius:14px; border:0; background:var(--brand); color:#fff}
  .addbtn:hover{background:var(--brand-strong)}
  .addbtn svg{width:18px;height:18px}
  .navgrp{padding:6px 0}
  .navgrp .lbl{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; color:var(--faint); padding:6px 10px}
  .snav{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; cursor:pointer;
    font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:14.5px; color:var(--ink-2);
    padding:11px 11px; border-radius:12px; position:relative}
  .snav svg{width:19px;height:19px;flex:none;opacity:.85}
  .snav:hover{background:var(--surface-2); color:var(--ink)}
  .snav.on{background:var(--ink); color:#fff}
  .snav.on svg{opacity:1}
  .snav .nb{margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--brand); color:#fff;
    font-family:var(--cond); font-weight:800; font-size:12px; display:grid; place-items:center}
  .snav.on .nb{background:#fff; color:var(--ink)}
  .sb-spacer{flex:1 1 auto}
  .sb-user{display:flex; align-items:center; gap:11px; padding:12px 8px 2px; border-top:1px solid var(--line); margin-top:6px}
  .sb-user .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:15px;flex:none}
  .sb-user .u-n{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:13.5px; line-height:1}
  .sb-user .u-r{font-size:11.5px; color:var(--ink-2); margin-top:3px}

  /* main content */
  main{flex:1 1 auto; min-width:0; overflow-y:auto; height:100dvh}
  @media (max-width:899px){ main{height:auto} }
  .page{max-width:840px; margin:0 auto; padding:26px clamp(16px,4.5vw,40px) 130px}
  @media (min-width:900px){ .page{padding-top:40px; padding-bottom:60px} }
  .screen{display:none; animation:fadein .3s ease both}
  .screen.on{display:block}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  .screen.on .rz{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
  .screen.on .rz:nth-child(2){animation-delay:.04s}
  .screen.on .rz:nth-child(3){animation-delay:.08s}
  .screen.on .rz:nth-child(4){animation-delay:.12s}
  .screen.on .rz:nth-child(5){animation-delay:.16s}
  .screen.on .rz:nth-child(6){animation-delay:.2s}

  /* headings */
  .hello{margin-bottom:22px}
  .hello .hi{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.004em; font-size:clamp(34px,8vw,54px); line-height:.92}
  .hello .club{display:flex; align-items:center; gap:10px; margin-top:8px}
  .hello .club .cn{font-family:var(--sans); font-weight:700; font-size:16px; letter-spacing:.01em}
  .hello .club .dot{width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .hello .sub{color:var(--ink-2); font-size:14.5px; margin-top:5px}

  .shead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:30px 2px 14px}
  .shead h2{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:22px; line-height:1}
  .shead .lk{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:12px; color:var(--brand); background:none; border:0; cursor:pointer; padding:0}
  .shead .lk:hover{color:var(--brand-strong)}
  .ptitle{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.004em; font-size:clamp(30px,6vw,44px); line-height:.94}
  .peyebrow{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:var(--faint); margin-bottom:6px}
  .pintro{color:var(--ink-2); font-size:14.5px; line-height:1.5; margin-top:8px; max-width:560px}

  /* cards */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .card.soft{box-shadow:none}
  .card.pad{padding:20px}

  /* today hero */
  .today{display:flex; align-items:center; gap:22px; background:var(--ink); color:#fff; border-radius:var(--radius); padding:24px 24px; box-shadow:var(--shadow-lg)}
  .ring{flex:none; width:96px; height:96px; position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .rc{stroke:rgba(255,255,255,.16)}
  .ring .rp{stroke:#fff; stroke-linecap:round; transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
  .ring .rt{position:absolute; inset:0; display:grid; place-items:center; text-align:center}
  .ring .rt b{font-family:var(--cond); font-weight:900; font-size:26px; line-height:.9}
  .ring .rt span{display:block; font-size:10px; color:rgba(255,255,255,.7); letter-spacing:.04em}
  .today .tx .k{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:11px; color:rgba(255,255,255,.66)}
  .today .tx .v{font-family:var(--cond); font-weight:800; font-size:clamp(22px,5.5vw,30px); line-height:1.02; margin:6px 0 2px}
  .today .tx .s{font-size:13px; color:rgba(255,255,255,.72)}
  .today .tx .alldone{color:#CFE7D8}

  /* operation cards grid */
  .opgrid{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px}
  @media (min-width:620px){ .opgrid{grid-template-columns:1fr 1fr} }
  .opcard{display:flex; flex-direction:column; gap:0; text-align:left; cursor:pointer; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:17px 17px 15px; box-shadow:var(--shadow); transition:transform .12s, box-shadow .2s}
  .opcard:hover{box-shadow:var(--shadow-lg); transform:translateY(-1px)}
  .opcard:active{transform:translateY(0)}
  .opcard .oc-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .opcard .oc-zone{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:20px; line-height:1}
  .opcard .oc-act{color:var(--ink-2); font-size:13.5px; margin-top:5px}
  .opcard .oc-foot{display:flex; align-items:center; gap:10px; margin-top:14px}
  .opcard .oc-time{font-family:var(--cond); font-weight:700; font-size:14px; color:var(--ink); letter-spacing:.02em}
  .opcard.done{background:var(--surface-2)}
  .opcard.done .oc-zone{color:var(--ink-2)}

  /* pills (never color-only: dot + label) */
  .pill{display:inline-flex; align-items:center; gap:7px; font-family:var(--cond); font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; font-size:11.5px; padding:5px 11px; border-radius:var(--radius-pill); white-space:nowrap; border:1px solid transparent}
  .pill .pd{width:7px;height:7px;border-radius:50%; flex:none}
  .pill.todo{background:var(--surface); border-color:var(--line-2); color:var(--ink)} .pill.todo .pd{background:var(--warn)}
  .pill.done{background:var(--good-soft); color:var(--good)} .pill.done .pd{background:var(--good)}
  .pill.attn{background:var(--brand-soft); color:var(--brand-strong)} .pill.attn .pd{background:var(--brand)}
  .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.warn .pd{background:var(--warn)}
  .pill.info{background:var(--info-soft); color:var(--info)} .pill.info .pd{background:var(--info)}
  .pill.mute{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)} .pill.mute .pd{background:var(--faint)}
  .pill.ok{background:var(--good-soft); color:var(--good)} .pill.ok .pd{background:var(--good)}
  .pill.ghost{background:transparent; border-color:var(--line-2); color:var(--ink-2)} .pill.ghost .pd{background:var(--faint)}

  /* attention / fighter list cards */
  .stack{display:flex; flex-direction:column; gap:11px; margin-top:14px}
  .lcard{display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left; cursor:pointer; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px 16px; box-shadow:var(--shadow)}
  .lcard:hover{box-shadow:var(--shadow-lg)}
  .lcard.attnbg{background:var(--brand-soft); border-color:#F2D8D3}
  .lcard .li{flex:none; width:40px;height:40px;border-radius:12px; display:grid;place-items:center; background:var(--surface-2); border:1px solid var(--line)}
  .lcard.attnbg .li{background:#fff; border-color:#F2D8D3; color:var(--brand)}
  .lcard .li svg{width:20px;height:20px}
  .lcard .lg{min-width:0; flex:1 1 auto}
  .lcard .lt{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:16px; line-height:1.05}
  .lcard .ld{color:var(--ink-2); font-size:13.5px; margin-top:4px; line-height:1.4; overflow-wrap:anywhere}
  .lcard .lm{display:flex; align-items:center; gap:9px; margin-top:9px; flex-wrap:wrap}
  .lcard .lmeta{font-size:12px; color:var(--faint)}
  .lcard .lchev{align-self:center; color:var(--faint); flex:none}
  .quote{font-style:italic}

  /* bilan card */
  .bilancard{display:flex; align-items:center; gap:18px; background:linear-gradient(120deg,#fff, #FBFAF6); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow)}
  .bilancard .bemblem{flex:none; width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .bilancard .bemblem svg{width:26px;height:26px}
  .bilancard .bg{flex:1 1 auto; min-width:0}
  .bilancard .bk{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--faint)}
  .bilancard .bt{font-family:var(--cond); font-weight:800; text-transform:uppercase; font-size:18px; line-height:1; margin:3px 0 5px}
  .bilancard .bs{font-size:13px; color:var(--ink-2); line-height:1.45}
  .bilancard .bgo{flex:none}
  @media (max-width:560px){ .bilancard{flex-wrap:wrap} .bilancard .bgo{width:100%} }

  /* timeline (registre) */
  .tl{margin-top:8px}
  .tl-day{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--faint); margin:22px 0 6px}
  .tl-item{display:flex; gap:16px; width:100%; text-align:left; background:none; border:0; cursor:pointer; padding:12px 2px; position:relative}
  .tl-rail{flex:none; width:64px; text-align:right; font-family:var(--cond); font-weight:700; font-size:14px; color:var(--ink); padding-top:1px}
  .tl-mid{flex:none; position:relative; width:14px}
  .tl-mid .n{position:absolute; left:3px; top:7px; width:9px;height:9px;border-radius:50%; background:var(--ink); box-shadow:0 0 0 4px var(--bg)}
  .tl-mid .n.attn{background:var(--brand)}
  .tl-mid::before{content:""; position:absolute; left:7px; top:0; bottom:-24px; width:2px; background:var(--line)}
  .tl-item:last-child .tl-mid::before{display:none}
  .tl-body{min-width:0; flex:1 1 auto; padding-bottom:2px}
  .tl-t{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:16px; line-height:1.05}
  .tl-d{color:var(--ink-2); font-size:13px; margin-top:3px}
  .tl-by{color:var(--faint); font-size:12.5px; margin-top:3px}
  .tl-tag{margin-top:7px}

  /* filters */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  .fchip{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:12.5px; padding:8px 13px; border-radius:var(--radius-pill); border:1px solid var(--line-2); background:var(--surface); cursor:pointer; color:var(--ink-2)}
  .fchip.on{background:var(--ink); color:#fff; border-color:var(--ink)}

  /* controls cards */
  .ctlcard{display:flex; align-items:center; gap:16px; width:100%; text-align:left; cursor:pointer; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:17px 17px; box-shadow:var(--shadow)}
  .ctlcard:hover{box-shadow:var(--shadow-lg)}
  .ctlcard .cg{flex:1 1 auto; min-width:0}
  .ctlcard .ct{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:17px; line-height:1.05}
  .ctlcard .cs{color:var(--ink-2); font-size:13px; margin-top:4px}
  .ctlcard .cs b{color:var(--ink); font-weight:600}

  /* settings rows */
  .srow{display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:15px 16px; box-shadow:var(--shadow); margin-bottom:10px}
  .srow:hover{box-shadow:var(--shadow-lg)}
  .srow .sg{flex:1 1 auto; min-width:0}
  .srow .st{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:16px; line-height:1.05}
  .srow .ss{color:var(--ink-2); font-size:12.5px; margin-top:3px}
  .srow .schev{color:var(--faint); flex:none}
  .subtabs{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 4px}

  .empty{text-align:center; color:var(--ink-2); padding:34px 20px; background:var(--surface-2); border:1px dashed var(--line-2); border-radius:var(--radius-sm); margin-top:14px}
  .empty .big{font-family:var(--cond); font-weight:800; text-transform:uppercase; font-size:17px; color:var(--ink); margin-bottom:5px}
  .backlink{display:inline-flex; align-items:center; gap:7px; background:none; border:0; cursor:pointer; color:var(--ink-2);
    font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:12px; padding:0; margin-bottom:14px}

  /* bottom nav (mobile) */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:none; grid-template-columns:repeat(5,1fr);
    align-items:center; background:rgba(255,255,255,.92); backdrop-filter:blur(12px) saturate(1.1); border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .tab{display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; cursor:pointer; color:var(--faint); padding:5px 2px}
  .tab svg{width:22px;height:22px}
  .tab .tl2{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:9.5px}
  .tab.on{color:var(--ink)}
  .tab .nb2{position:absolute; margin-left:22px; margin-top:-6px; min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--brand);color:#fff;font-family:var(--cond);font-weight:800;font-size:10px;display:grid;place-items:center}
  .tab.plus{position:relative}
  .tab.plus .fab{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px -6px rgba(200,56,48,.6); border:3px solid var(--bg)}
  .tab.plus .fab svg{width:26px;height:26px}
  @media (max-width:899px){ .sidebar{display:none} .tabbar{display:grid} }
  @media (min-width:900px){ .mtop{display:none} }

  /* sheet */
  .scrim{position:fixed; inset:0; background:rgba(22,21,15,.45); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s}
  .scrim.on{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,102%); z-index:41; width:100%; max-width:520px;
    background:var(--surface); border-radius:26px 26px 0 0; box-shadow:var(--shadow-lg); transition:transform .32s cubic-bezier(.2,.8,.2,1);
    max-height:92dvh; display:flex; flex-direction:column}
  .sheet.on{transform:translate(-50%,0)}
  @media (min-width:640px){ .sheet{bottom:auto; top:50%; transform:translate(-50%,-46%) scale(.98); opacity:0; border-radius:24px; max-height:88dvh}
    .sheet.on{transform:translate(-50%,-50%) scale(1); opacity:1} }
  .sh-grab{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:10px auto 2px}
  @media (min-width:640px){ .sh-grab{display:none} }
  .sh-head{padding:12px 24px 8px}
  .sh-k{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--brand)}
  .sh-title{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.005em; font-size:26px; line-height:1; margin-top:3px}
  .sh-body{padding:6px 24px 4px; overflow-y:auto}
  .sh-foot{padding:14px 24px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:9px}
  @media (min-width:640px){ .sh-foot{padding-bottom:20px} }

  .fieldlab{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:12px; color:var(--ink); margin:16px 0 8px}
  .fieldlab .opt{color:var(--faint); font-weight:600}
  .choices{display:flex; flex-wrap:wrap; gap:8px}
  .choice{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:13px; padding:10px 14px; border-radius:12px; border:1px solid var(--line-2); background:var(--surface); cursor:pointer; color:var(--ink)}
  .choice.sel{background:var(--ink); color:#fff; border-color:var(--ink)}
  textarea,input[type=text],input[type=date],input[type=time]{width:100%; font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line-2); border-radius:12px; padding:12px 13px; resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--ink); outline-offset:1px}
  .protobox{background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:14px 15px; margin-top:6px}
  .protobox .pc-name{font-family:var(--cond); font-weight:800; text-transform:uppercase; font-size:15px; margin-bottom:8px}
  .protobox .pc-row{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:4px 0; border-top:1px solid var(--line)}
  .protobox .pc-row span{color:var(--ink-2)} .protobox .pc-row b{font-weight:600; text-align:right}
  .protobox .pc-note{font-size:12.5px; color:var(--ink-2); margin-top:8px; line-height:1.45; font-style:italic}

  .btn{width:100%; font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:16px;
    padding:15px; border-radius:14px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px}
  .btn:hover{background:#000}
  .btn svg{width:18px;height:18px}
  .btn.brand{background:var(--brand); border-color:var(--brand)} .btn.brand:hover{background:var(--brand-strong)}
  .btn.ghost{background:transparent; color:var(--ink)}
  .btn.good{background:var(--good); border-color:var(--good)}
  .btn[disabled]{opacity:.4; cursor:not-allowed}
  .btnrow{display:flex; gap:9px} .btnrow .btn{flex:1}

  /* detail flow steps */
  .flow{margin-top:6px}
  .fstep{display:flex; gap:13px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line)}
  .fstep:first-child{border-top:0}
  .fstep .fb{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2); flex:none; display:grid; place-items:center; color:#fff; margin-top:1px}
  .fstep.done .fb{background:var(--good); border-color:var(--good)} .fstep.done .fb svg{width:12px;height:12px}
  .fstep.cur .fb{border-color:var(--ink); background:var(--ink)}
  .fstep .ft{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:15px; line-height:1.1}
  .fstep .fs{font-size:12.5px; color:var(--ink-2); margin-top:2px; line-height:1.4}
  .fstep.todo .ft{color:var(--faint)}
  .detail-meta{display:grid; grid-template-columns:1fr 1fr; gap:2px 16px; margin:8px 0 4px}
  .detail-meta .dm{padding:9px 0; border-top:1px solid var(--line)}
  .detail-meta .dm .k{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:10.5px; color:var(--faint)}
  .detail-meta .dm .v{font-size:14px; margin-top:2px; overflow-wrap:anywhere}
  .proofimg{width:100%; max-height:220px; object-fit:cover; border-radius:12px; border:1px solid var(--line); margin-top:8px}

  /* burst + toast */
  .burst{position:absolute; inset:0; background:var(--surface); border-radius:26px 26px 0 0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:5; padding:30px; text-align:center}
  @media(min-width:640px){ .burst{border-radius:24px} }
  .burst.on{display:flex; animation:fadein .2s both}
  .burst .bring{width:76px;height:76px;border-radius:50%;background:var(--good-soft);border:2px solid var(--good);display:grid;place-items:center;color:var(--good); animation:pop .4s cubic-bezier(.2,.9,.3,1.4) both}
  @keyframes pop{from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1}}
  .burst .bring svg{width:38px;height:38px}
  .burst .btt{font-family:var(--cond); font-weight:900; text-transform:uppercase; font-size:24px}
  .burst .bss{color:var(--ink-2); font-size:14px}
  .toast{position:fixed; left:50%; bottom:96px; transform:translate(-50%,20px); z-index:60; background:var(--ink); color:#fff;
    display:flex; align-items:center; gap:10px; font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:13.5px;
    padding:13px 18px; border-radius:14px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:.3s}
  .toast.on{opacity:1; transform:translate(-50%,0)}
  .toast svg{width:18px;height:18px;color:#9FE3BC}
  @media(min-width:900px){ .toast{bottom:30px} }

  /* ensure stacked title/description spans never run together */
  .lcard .lt,.lcard .ld,.bilancard .bk,.bilancard .bt,.bilancard .bs,
  .srow .st,.srow .ss,.ctlcard .ct,.ctlcard .cs,
  .tl-t,.tl-d,.tl-by,.fstep .ft,.fstep .fs{display:block}
  .bilancard .bg{display:block}

  /* print (bilan) */
  #printArea{display:none}
  @media print{
    .app,.scrim,.sheet,.toast{display:none!important}
    #printArea{display:block!important; color:#111}
    #printArea .rp-brand{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:15px; color:#C83830}
    #printArea h2{font-family:var(--cond); text-transform:uppercase; font-size:26px; margin:6px 0 2px}
    #printArea .bt{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.04em; font-size:13px; color:#C83830; margin-top:16px}
    #printArea .bp{font-size:13px; line-height:1.5; margin:5px 0}
    #printArea ul{margin:5px 0; padding-left:18px} #printArea li{font-size:12.5px; line-height:1.45}
    #printArea .meta{color:#666; font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<script>
"use strict";
/* =====================================================================
   MATSAFE CLUB — Pilotage et traçabilité de l'hygiène
   Espace gérant / référent hygiène. Refonte premium de MatSafe Control.
   Logique métier conservée (plan du jour, validation, points d'attention,
   contrôles, registre, export) + intégration des retours MATSAFE Fighter.
   Données de démonstration (localStorage). Prêt à être relié plus tard à
   une API : toute la lecture/écriture passe par le modèle STATE + save().
   ===================================================================== */

/* --------------------------- Référentiels --------------------------- */
var OP_TYPES=[
  {code:'training_surface_cleaning', name:'Tatamis',         full:'Nettoyage et désinfection'},
  {code:'changing_room_cleaning',    name:'Vestiaires',      full:'Nettoyage vestiaires'},
  {code:'shower_cleaning',           name:'Douches',         full:'Nettoyage des douches'},
  {code:'restroom_cleaning',         name:'Sanitaires',      full:'Nettoyage sanitaires'},
  {code:'shared_equipment_cleaning', name:'Matériel partagé',full:'Nettoyage du matériel partagé'},
  {code:'first_aid_check',           name:'Premiers secours',full:'Vérification premiers secours'}
];
var FREQS=[['daily','Chaque jour'],['some_days','Certains jours'],['multi_daily','Plusieurs fois / jour'],['after_use','Après chaque séance'],['weekly','Chaque semaine'],['monthly','Chaque mois'],['once','Ponctuel']];
var FREQ_NEEDS_DAYS=['some_days','weekly'];
var ANO_CATS=[['hygiene','Hygiène'],['equipment','Équipement'],['product','Consommable'],['damage','Dégât'],['installation','Installation'],['first_aid','Premiers secours'],['other','Autre']];
var CTL_TYPES=[['first_aid_kit_check','Trousse de secours'],['products_check','Produits d’entretien'],['equipment_check','Équipements'],['documentation_check','Documentation']];
var ZONE_TYPES=[['tatami','Tatami'],['training_area','Espace d’entraînement'],['ring','Ring'],['cage','Cage MMA'],['heavy_bags','Sacs de frappe'],['changing_room','Vestiaire'],['shower','Douches'],['restroom','Sanitaires'],['reception','Réception'],['shared_equipment','Matériel partagé'],['first_aid','Premiers secours'],['other','Autre']];
var DEFAULT_ZONES=[['Tatami principal','tatami'],['Tatami 2','tatami'],['Vestiaires & douches','changing_room'],['Sanitaires','restroom'],['Matériel partagé','shared_equipment'],['Réception','reception'],['Premiers secours','first_aid']];
var WEEKDAYS=[[1,'Lun'],[2,'Mar'],[3,'Mer'],[4,'Jeu'],[5,'Ven'],[6,'Sam'],[0,'Dim']];
var FIGHTER_INBOX='matsafe_fighter_inbox';   // clé écrite par l'app MATSAFE Fighter (même origine)
var STORE='matsafe_club_v2';

/* Points d'attention : cycle de vie en vocabulaire clair */
var ANO_FLOW=[
  ['open','À vérifier','Nouveau point d’attention'],
  ['in_progress','Pris en charge','Responsable du traitement désigné'],
  ['corrected','Correction effectuée','Action corrective réalisée · preuve facultative'],
  ['verified','Vérifié','Validé par le responsable'],
  ['closed','Clos','Clôture définitive']
];
function anoStatusLabel(s){return ({open:'À vérifier',in_progress:'Pris en charge',corrected:'Correction effectuée',verified:'Vérifié',closed:'Clos'})[s]||s;}
function anoPill(s){var m={open:'attn',in_progress:'warn',corrected:'info',verified:'ok',closed:'mute'};return pill(m[s]||'mute', anoStatusLabel(s));}
function fighterStatusLabel(s){return ({to_verify:'Nouveau · À vérifier',in_progress:'Pris en charge',resolved:'Résolu',converted:'Transformé en point d’attention',dismissed:'Non confirmé'})[s]||s;}
function fighterPill(s){var m={to_verify:'attn',in_progress:'warn',resolved:'ok',converted:'info',dismissed:'mute'};return pill(m[s]||'mute', fighterStatusLabel(s));}

/* ------------------------------ Helpers ------------------------------ */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function id(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function opType(c){for(var i=0;i<OP_TYPES.length;i++)if(OP_TYPES[i].code===c)return OP_TYPES[i];return {name:c,full:c};}
function ctlName(c){for(var i=0;i<CTL_TYPES.length;i++)if(CTL_TYPES[i][0]===c)return CTL_TYPES[i][1];return c;}
function catName(c){for(var i=0;i<ANO_CATS.length;i++)if(ANO_CATS[i][0]===c)return ANO_CATS[i][1];return c;}
function freqLabel(f){for(var i=0;i<FREQS.length;i++)if(FREQS[i][0]===f)return FREQS[i][1];return f;}
function zoneTypeName(c){for(var i=0;i<ZONE_TYPES.length;i++)if(ZONE_TYPES[i][0]===c)return ZONE_TYPES[i][1];return c;}
/* Nom d'action : action personnalisée sinon libellé de la bibliothèque MATSAFE */
function planActionName(t){return t.actionName || opType(t.opTypeCode).name;}
function planActionFull(t){return t.actionName || opType(t.opTypeCode).full;}
function opActionFull(o){return o.actionName || opType(o.type).full;}
function daysLabel(days){ if(!days||!days.length)return ''; return WEEKDAYS.filter(function(w){return days.indexOf(w[0])>=0;}).map(function(w){return w[1];}).join(', '); }
/* Résumé lisible d'une fréquence de plan (pour l'affichage) */
function freqSummary(t){
  var f=t.frequency, times=(t.times&&t.times.length)?t.times.join(' · '):'';
  if(f==='daily') return 'Chaque jour'+(times?' · '+times:'');
  if(f==='multi_daily') return 'Plusieurs fois / jour'+(times?' · '+times:'');
  if(f==='some_days') return (daysLabel(t.days)||'Certains jours')+(times?' · '+times:'');
  if(f==='weekly') return 'Chaque semaine'+(t.days&&t.days.length?' ('+daysLabel(t.days)+')':'')+(times?' · '+times:'');
  if(f==='monthly') return 'Chaque mois'+(t.monthDay?' (le '+t.monthDay+')':'')+(times?' · '+times:'');
  if(f==='once') return 'Ponctuel'+(t.onceAt?' · '+shortDate(t.onceAt):'')+(times?' · '+times:'');
  if(f==='after_use') return 'Après chaque séance';
  return freqLabel(f);
}
function pad2(n){return (n<10?'0':'')+n;}
function timeFmt(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function isToday(ts){return new Date(ts).toDateString()===new Date().toDateString();}
function isYesterday(ts){return new Date(ts).toDateString()===new Date(Date.now()-864e5).toDateString();}
function dayLabel(ts){if(isToday(ts))return "Aujourd’hui";if(isYesterday(ts))return 'Hier';return new Date(ts).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function dateHead(ts){return new Date(ts).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function shortDate(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function relDays(ts){var d=Math.floor((Date.now()-ts)/864e5); if(d<=0)return "aujourd’hui"; if(d===1)return 'hier'; return 'il y a '+d+' j';}
function pill(kind,label){return '<span class="pill '+kind+'"><span class="pd"></span>'+esc(label)+'</span>';}
function firstName(n){return (n||'').split(' ')[0];}
function initials(n){var p=(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}

/* mojibake repair (UTF-8 relu Latin-1) */
function fixMojibake(s){if(typeof s!=='string'||!/[ÃÂ]/.test(s))return s;try{var b=Uint8Array.from(s,function(c){return c.charCodeAt(0)&0xff;});var d=new TextDecoder('utf-8',{fatal:false}).decode(b);if(!/[ÃÂ]/.test(d)&&d.indexOf(String.fromCharCode(0xFFFD))===-1)return d;}catch(e){}return s;}
function repair(o){if(Array.isArray(o))return o.map(repair);if(o&&typeof o==='object'){for(var k in o)o[k]=repair(o[k]);return o;}return fixMojibake(o);}

/* Ingestion des retours envoyés par l'app Fighter (même origine) */
function ingestFighter(){
  var inbox=[]; try{inbox=JSON.parse(localStorage.getItem(FIGHTER_INBOX)||'[]');}catch(e){}
  if(!inbox.length) return;
  var known={}; db.fighter.forEach(function(f){if(f.srcId)known[f.srcId]=1;});
  inbox.forEach(function(r){
    if(known[r.id]) return;
    db.fighter.unshift({id:id(), srcId:r.id, zone:r.zone||'—', text:r.description||r.comment||'', at:r.ts||Date.now(), status:'to_verify', origin:'fighter', history:[], photo:r.photo||null, cat:r.cat||null, kind:r.kind||'signal'});
  });
}

/* --------------------- Plan du jour --------------------- */
function todayOccurrences(){
  var now=new Date(), wd=now.getDay(), dom=now.getDate(), occ=[];
  STATE.config.plan.forEach(function(task){
    if(!task.active) return;
    if(task.frequency==='after_use') return;          // à la demande, jamais échéancé
    var due=false, f=task.frequency;
    if(f==='daily'||f==='multi_daily') due=true;
    else if(f==='some_days'||f==='weekly') due=(task.days||[]).indexOf(wd)>=0;
    else if(f==='monthly') due=(task.monthDay||1)===dom;
    else if(f==='once') due=!!task.onceAt && new Date(task.onceAt).toDateString()===now.toDateString();
    if(!due) return;
    var z=zoneById(task.zoneId), zoneName=z?z.name:'—', ot=opType(task.opTypeCode);
    var times=(task.times&&task.times.length)?task.times.slice().sort():[''];
    times.forEach(function(t){ occ.push({task:task, slot:t, zoneName:zoneName, ot:ot}); });
  });
  occ.sort(function(a,b){ return (a.slot||'~').localeCompare(b.slot||'~'); }); // heures d'abord, sans-heure en dernier
  return occ;
}
function afterUseTasks(){
  return STATE.config.plan.filter(function(t){return t.active&&t.frequency==='after_use';})
    .map(function(task){var z=zoneById(task.zoneId);return {task:task,zoneName:z?z.name:'—',ot:opType(task.opTypeCode)};});
}
function occDone(task,slot){
  return db.ops.filter(function(o){return isToday(o.at)&&o.planId===task.id&&(o.slot||'')===(slot||'');}).sort(function(a,b){return b.at-a.at;})[0]||null;
}
function openAnos(){return db.anos.filter(function(a){return a.status!=='closed';});}
function newFighter(){return db.fighter.filter(function(f){return f.status==='to_verify';});}
function ctlStatus(c){
  if(c.status==='completed')return['ok','Terminé'];
  if(c.status==='cancelled')return['mute','Annulé'];
  if(c.due<Date.now())return['attn','En retard'];
  if(c.due<=Date.now()+2*864e5)return['warn','À réaliser'];
  return['info','Planifié'];
}

function opCardHTML(o,kind,i){
  var d = kind==='occ' ? occDone(o.task,o.slot) : null;
  var doneToday = kind==='au' ? db.ops.filter(function(x){return isToday(x.at)&&x.planId===o.task.id;}).length : 0;
  var isDone = kind==='occ' ? !!d : false;
  var timeTxt = o.slot ? o.slot : (o.task.frequency==='after_use' ? 'À la demande' : 'Dans la journée');
  var statusHTML = isDone
    ? pill('done','Terminé à '+timeFmt(d.at))
    : (kind==='au' ? pill('mute', doneToday?doneToday+' aujourd’hui':'À valider') : pill('todo','À faire'));
  return '<button class="opcard rz '+(isDone?'done':'')+'" data-'+kind+'="'+i+'">'+
    '<div class="oc-top"><span class="oc-zone">'+esc(o.zoneName)+'</span>'+statusHTML+'</div>'+
    '<div class="oc-act">'+esc(planActionFull(o.task))+'</div>'+
    '<div class="oc-foot"><span class="oc-time">'+esc(timeTxt)+'</span>'+
      (isDone?'<span class="lmeta" style="color:var(--faint);font-size:12.5px">· '+esc(d.by||'')+'</span>':'')+'</div>'+
  '</button>';
}

/* ----------------------------- REGISTRE ----------------------------- */
var regFilter={zone:'',type:'all'};
function viewReg(){
  var head='<div class="peyebrow rz">Historique</div><div class="shead rz" style="margin-top:2px"><h2 class="ptitle" style="font-size:clamp(30px,6vw,44px)">Registre</h2><button class="lk" data-act="export">Exporter</button></div>'+
    '<p class="pintro rz">L’historique complet des opérations et points d’attention, du plus récent au plus ancien.</p>';
  // filters (type)
  var typeChips=[['all','Tout'],['op','Opérations'],['attn','Points d’attention']].map(function(t){return '<button class="fchip '+(regFilter.type===t[0]?'on':'')+'" data-ftype="'+t[0]+'">'+t[1]+'</button>';}).join('');
  var filters='<div class="filters rz">'+typeChips+'</div>';

  // merge ops + anomalies into timeline events
  var evs=[];
  db.ops.forEach(function(o){var d=opActionFull(o)+(o.slot?' · prévu '+o.slot:'')+(o.extra?' · supplémentaire':''); evs.push({at:o.at, attn:o.anomaly, kind:'op', t:o.zone||opType(o.type).name, d:d, by:o.by, tag: o.anomaly?pill('attn','Anomalie constatée'):(o.extra?pill('info','Supplémentaire'):pill('ok','Conforme')), ref:{op:o.id}});});
  db.anos.forEach(function(a){ evs.push({at:a.at, attn:true, kind:'attn', t:a.zone, d:'Point d’attention — '+catName(a.cat), by:a.by, tag:anoPill(a.status), ref:{ano:a.id}}); });
  if(regFilter.type==='op') evs=evs.filter(function(e){return e.kind==='op';});
  if(regFilter.type==='attn') evs=evs.filter(function(e){return e.kind==='attn';});
  evs.sort(function(a,b){return b.at-a.at;});

  var tl='', last='';
  evs.forEach(function(e){
    var dl=dayLabel(e.at); if(dl!==last){tl+='<div class="tl-day">'+dl+'</div>'; last=dl;}
    var attr = e.ref.op?('data-op="'+e.ref.op+'"'):('data-ano="'+e.ref.ano+'"');
    tl+='<button class="tl-item" '+attr+'><span class="tl-rail">'+timeFmt(e.at)+'</span>'+
      '<span class="tl-mid"><span class="n '+(e.attn?'attn':'')+'"></span></span>'+
      '<span class="tl-body"><span class="tl-t">'+esc(e.t)+'</span><span class="tl-d">'+esc(e.d)+'</span>'+
      '<span class="tl-by">'+esc(e.by||'')+'</span><span class="tl-tag">'+e.tag+'</span></span></button>';
  });
  return head + filters + '<div class="tl rz">'+(tl||emptyBox('Registre vide'))+'</div>';
}

function actionRouter(a){
  if(a==='add') return openAdd();
  if(a==='pick') return openPick();
  if(a==='report') return openReport();
  if(a==='export') return openExport();
  if(a==='bilan') return openBilan();
  if(a==='ctlplan') return openCtlPlan();
  if(a==='zoneadd') return openZoneEdit(null);
  if(a==='protoadd') return openProtoEdit(null);
  if(a==='planadd') return openPlanEdit(null);
  if(a==='clubedit') return openClubEdit();
  if(a==='useradd') return openUserEdit();
  if(a==='switchuser') return openSwitchUser();

}

/* photo capture -> compressed dataURL */
function pickPhoto(cb){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.onchange=function(){var f=inp.files&&inp.files[0]; if(!f){cb(null);return;} var r=new FileReader();
    r.onload=function(){var img=new Image(); img.onload=function(){var mx=1024,w=img.width,h=img.height;
      if(w>h&&w>mx){h=Math.round(h*mx/w);w=mx;} else if(h>mx){w=Math.round(w*mx/h);h=mx;}
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',0.7));}catch(e){cb(null);}}; img.onerror=function(){cb(null);}; img.src=r.result;}; r.readAsDataURL(f);};
  inp.click();
}

/* ----------------- Détail + workflow point d'attention ----------------- */
function openAnoDetail(anoId){
  var a=null; for(var i=0;i<db.anos.length;i++)if(db.anos[i].id===anoId)a=db.anos[i]; if(!a)return;
  var idx=ANO_FLOW.map(function(f){return f[0];}).indexOf(a.status);
  var steps=ANO_FLOW.map(function(f,i){var cls=i<idx?'done':(i===idx?'cur':'todo');
    return '<div class="fstep '+cls+'"><span class="fb">'+(i<idx?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':'')+'</span><span><span class="ft">'+esc(f[1])+'</span><span class="fs">'+esc(f[2])+'</span></span></div>';
  }).join('');
  var meta='<div class="detail-meta">'+dm('Zone',a.zone)+dm('Nature',catName(a.cat))+dm('Signalé',dayLabel(a.at)+' · '+timeFmt(a.at))+dm('Origine',a.origin==='fighter'?'Retour Fighter':(a.origin==='control'?'Contrôle':'Club'))+
    (a.assignedTo?dm('Responsable',a.assignedTo):'')+(a.by?dm('Par',a.by):'')+'</div>';
  var desc='<div class="fieldlab">Problème</div><div class="card soft pad" style="padding:14px">'+esc(a.desc)+'</div>';
  var photo=a.photo?'<div class="fieldlab">Photo</div><img class="proofimg" src="'+a.photo+'" alt="preuve">':'';
  var corr = a.correctiveAction?'<div class="fieldlab">Action corrective</div><div class="card soft pad" style="padding:14px">'+esc(a.correctiveAction)+(a.correctedAt?'<div style="color:var(--faint);font-size:12px;margin-top:6px">Corrigé le '+dayLabel(a.correctedAt)+'</div>':'')+'</div>':'';
  var proof = a.proofPhoto?'<div class="fieldlab">Preuve de correction</div><img class="proofimg" src="'+a.proofPhoto+'" alt="preuve">':'';
  var body='<div class="fieldlab" style="margin-top:6px">Statut</div><div class="flow">'+steps+'</div>'+meta+desc+photo+corr+proof;
  var foot='';
  if(a.status!=='closed'){ var nextLabel=ANO_FLOW[idx+1]?ANO_FLOW[idx+1][1]:''; foot='<button class="btn" id="adAdvance">Faire avancer → '+esc(nextLabel)+'</button>'; }
  else foot='<button class="btn ghost" id="adClose" style="border:1px solid var(--line-2)">Fermer</button>';
  openSheet('Point d’attention', a.zone, body, foot);
  if(a.status!=='closed') $('#adAdvance').onclick=function(){ advanceAno(a); };
  else $('#adClose').onclick=closeSheet;
}
function advanceAno(a){
  var idx=ANO_FLOW.map(function(f){return f[0];}).indexOf(a.status);
  var next=ANO_FLOW[idx+1]; if(!next)return; var nstat=next[0];
  a.history=a.history||[];
  if(nstat==='in_progress'){
    sheetForm('Prendre en charge','Qui s’en occupe ?',
      '<div class="fieldlab">Responsable</div><div class="choices" id="afWho">'+STATE.users.map(function(u){return '<button class="choice" data-w="'+esc(u.short)+'">'+esc(u.name)+'</button>';}).join('')+'</div>',
      'Confirmer', function(){ var w=$('.choice.sel',$('#afWho')); a.assignedTo=w?w.dataset.w:currentUser().short; commitAno(a,nstat,'Pris en charge — '+a.assignedTo); });
  } else if(nstat==='corrected'){
    var photo={v:null};
    sheetForm('Correction effectuée','Décrire la correction',
      '<div class="fieldlab">Action corrective</div><textarea id="afAct" rows="3" placeholder="Ce qui a été fait…"></textarea>'+
      '<div class="fieldlab">Preuve <span class="opt">— optionnel</span></div><div id="afPh"><button class="choice" id="afAdd">Ajouter une photo</button></div>',
      'Enregistrer la correction', function(){ a.correctiveAction=($('#afAct').value||'').trim(); a.correctedAt=Date.now(); if(photo.v)a.proofPhoto=photo.v; commitAno(a,nstat,'Correction effectuée'); },
      function(){ $('#afAdd').onclick=function(){ pickPhoto(function(d){ if(d){photo.v=d; $('#afPh').innerHTML='<img class="proofimg" src="'+d+'">';} }); }; },
      function(){ return ($('#afAct').value||'').trim().length>2; });
  } else if(nstat==='verified'){
    a.verifiedBy=currentUser().short; a.verifiedAt=Date.now(); commitAno(a,nstat,'Vérifié — '+a.verifiedBy);
  } else if(nstat==='closed'){
    a.closedAt=Date.now(); commitAno(a,nstat,'Clos');
  } else commitAno(a,nstat,anoStatusLabel(nstat));
}

        (anosClosed?'Points d’attention pris en charge et clôturés.':'Peu de points d’attention — bonne maîtrise.')
      ]},
      {t:'Points à consolider', list: anosOpen? ['Quelques points d’attention restent ouverts : les clôturer maintient la dynamique.'] : ['Aucun axe majeur ce mois-ci — le fonctionnement est maîtrisé.']},

      {t:'Message de clôture', p:'Le label reconnaît le travail accompli. Ce bilan sert à maintenir la dynamique, jamais à sanctionner. MATSAFE reste à vos côtés.'}

function openBilan(){
  var b=genBilan();
  var body=b.blocks.map(function(bl){ var inner=bl.list?'<ul style="margin:6px 0 0;padding-left:18px">'+bl.list.map(function(x){return '<li style="font-size:13.5px;line-height:1.5;margin:3px 0">'+esc(x)+'</li>';}).join('')+'</ul>':'<p style="margin:5px 0 0;font-size:14px;line-height:1.55;color:var(--ink)">'+esc(bl.p)+'</p>';
    return '<div style="padding:14px 0;border-top:1px solid var(--line)"><div style="font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:var(--brand)">'+esc(bl.t)+'</div>'+inner+'</div>';
  }).join('');
  openSheet('Bilan MATSAFE · '+esc(b.month), 'Votre bilan', body,
    '<div class="btnrow"><button class="btn ghost" id="blClose" style="border:1px solid var(--line-2)">Fermer</button><button class="btn brand" id="blPrint">Imprimer / PDF</button></div>');
  $('#blClose').onclick=closeSheet;
  $('#blPrint').onclick=function(){
    $('#printArea').innerHTML='<div class="rp-brand">MATSAFE CLUB</div><h2>Bilan mensuel — '+esc(b.month)+'</h2><div class="meta">'+esc(STATE.club.name)+' · '+esc(STATE.club.city||'')+'</div>'+
      b.blocks.map(function(bl){var inner=bl.list?'<ul>'+bl.list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p class="bp">'+esc(bl.p)+'</p>'; return '<div class="bt">'+esc(bl.t)+'</div>'+inner;}).join('');
    window.print();
  };
}

/* ------------------------------ Export ------------------------------ */
function openExport(){
  var now=new Date(); var d7=new Date(now.getTime()-6*864e5), d30=new Date(now.getTime()-29*864e5);
  openSheet('Registre','Exporter le registre',
    '<div class="fieldlab" style="margin-top:8px">Période</div><div class="choices" id="exP">'+
    '<button class="choice sel" data-p="7">7 derniers jours</button><button class="choice" data-p="30">30 derniers jours</button><button class="choice" data-p="all">Tout</button></div>'+
    '<p class="pintro" style="margin-top:14px">Génère un document imprimable (opérations, points d’attention, contrôles) pour la période choisie. Choisissez « Enregistrer au format PDF » dans la boîte d’impression.</p>',
    '<button class="btn" id="exGo">Générer</button>');
  $('#exGo').onclick=function(){ var p=($('.choice.sel',$('#exP'))||{dataset:{p:'7'}}).dataset.p; var from, label;
    if(p==='7'){from=d7.getTime(); label='7 derniers jours';} else if(p==='30'){from=d30.getTime(); label='30 derniers jours';} else {from=0; label='Historique complet';}
    buildAndPrint(from, now.getTime(), label); };
}
function buildAndPrint(from,to,label){
  var ops=db.ops.filter(function(o){return o.at>=from&&o.at<=to;}).sort(function(a,b){return a.at-b.at;});
  var anos=db.anos.filter(function(a){return a.at>=from&&a.at<=to;}).sort(function(a,b){return a.at-b.at;});
  var ctls=db.ctls.filter(function(c){return (c.completedAt&&c.completedAt>=from)||(c.status!=='completed'&&c.due>=from&&c.due<=to);});
  function row(cells){return '<tr>'+cells.map(function(c){return '<td style="padding:6px 8px;border-bottom:1px solid #ddd;font-size:12px;vertical-align:top">'+c+'</td>';}).join('')+'</tr>';}
  var opsT=ops.length?'<table style="width:100%;border-collapse:collapse"><tr>'+['Date','Heure','Zone','Opération','Par','Résultat'].map(function(h){return '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid #111;font-size:11px;text-transform:uppercase">'+h+'</th>';}).join('')+'</tr>'+ops.map(function(o){var t=opType(o.type);return row([new Date(o.at).toLocaleDateString('fr-FR'),timeFmt(o.at),esc(o.zone||''),esc(t.full)+(o.slot?' · '+o.slot:''),esc(o.by||''),o.anomaly?'Anomalie':'Conforme']);}).join('')+'</table>':'<p style="color:#666">Aucune opération.</p>';
  var anoT=anos.length?'<table style="width:100%;border-collapse:collapse"><tr>'+['Date','Zone','Nature','Description','Statut'].map(function(h){return '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid #111;font-size:11px;text-transform:uppercase">'+h+'</th>';}).join('')+'</tr>'+anos.map(function(a){return row([new Date(a.at).toLocaleDateString('fr-FR'),esc(a.zone),catName(a.cat),esc(a.desc),anoStatusLabel(a.status)]);}).join('')+'</table>':'<p style="color:#666">Aucun point d’attention.</p>';
  var ctlT=ctls.length?'<table style="width:100%;border-collapse:collapse"><tr>'+['Échéance','Contrôle','Zone','Statut'].map(function(h){return '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid #111;font-size:11px;text-transform:uppercase">'+h+'</th>';}).join('')+'</tr>'+ctls.map(function(c){return row([new Date(c.completedAt||c.due).toLocaleDateString('fr-FR'),ctlName(c.type),esc(c.zone||'—'),ctlStatus(c)[1]]);}).join('')+'</table>':'<p style="color:#666">Aucun contrôle.</p>';
  $('#printArea').innerHTML='<div class="rp-brand">MATSAFE CLUB</div><h2>Registre — '+esc(label)+'</h2><div class="meta">'+esc(STATE.club.name)+' · '+esc(STATE.club.city||'')+' · édité le '+new Date().toLocaleDateString('fr-FR')+'</div>'+
    '<div class="bt">Opérations d’hygiène</div>'+opsT+'<div class="bt">Points d’attention</div>'+anoT+'<div class="bt">Contrôles</div>'+ctlT;
  closeSheet(); window.print();
}
