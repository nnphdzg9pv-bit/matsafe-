<title>MatSafe Control · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A; --ink:#0A0A0A; --off:#F2F0EC; --cream:#F2F0EC;
    --paper:#FAF9F5; --paper-2:#EFECE4; --gray:#6B6B6B; --light:#E8E6E1; --border:#D8D5CF;
    --line:#0A0A0A;
    /* statuts (sobres, désaturés — distincts de l'identité 2 couleurs) */
    --ok:#2F6B4F; --ok-bg:#E4EEE8;
    --warn:#8A5A12; --warn-bg:#F1E7D3;
    --crit:#9E3826; --crit-bg:#F1DED9;
    --info:#3A4B6B; --info-bg:#E2E6EE;
    --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --sans:"Barlow","Segoe UI",system-ui,sans-serif;
    --shadow:0 1px 2px rgba(10,10,10,.05), 0 12px 30px rgba(10,10,10,.10);
    --shadow-sm:0 1px 2px rgba(10,10,10,.06);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:#141310;
    background-image:radial-gradient(120% 90% at 50% -10%, #201e19 0%, #141310 60%, #100f0c 100%);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; justify-content:center; align-items:center; min-height:100dvh; padding:24px;
  }
  @media (max-width:520px){ body{padding:0} }

  /* ---------- device frame ---------- */
  .app{
    position:relative; width:min(430px,100%); height:min(900px,100dvh);
    background:var(--cream); border-radius:30px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:var(--shadow);
    border:1px solid #26241e;
  }
  @media (max-width:520px){ .app{border-radius:0; height:100dvh; border:0} }

  /* ---------- header ---------- */
  .hdr{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 12px; background:var(--cream); border-bottom:1px solid var(--border);
  }
  .hdr .brand{display:flex; align-items:center; gap:9px}
  .hdr .brand img{height:24px; width:auto; display:block}
  .hdr .brand .ctl{font-family:var(--cond); font-weight:800; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--black); padding-left:9px; margin-left:2px; border-left:1.5px solid var(--border)}
  .icon-btn{appearance:none; border:1px solid var(--border); background:var(--paper); width:34px; height:34px; border-radius:9px; display:grid; place-items:center; cursor:pointer; color:var(--ink)}
  .icon-btn:active{transform:scale(.95)}

  /* ---------- screens ---------- */
  main{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch}
  .screen{display:none; padding:0 0 26px}
  .screen.active{display:block; animation:fade .28s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .screen.active{animation:none} }

  /* hero band (Accueil) */
  .hero{background:var(--black); color:var(--off); padding:22px 20px 24px}
  .hero .ey{font-family:var(--cond); text-transform:uppercase; letter-spacing:.2em; font-size:11.5px; font-weight:700; color:#9C978C}
  .hero h1{font-family:var(--cond); font-weight:800; font-size:32px; line-height:.98; letter-spacing:.01em; margin:6px 0 2px; text-transform:uppercase}
  .hero .meta{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap}
  .rolepill{font-family:var(--cond); font-weight:700; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--off); border:1px solid #3a3730; border-radius:20px; padding:4px 11px}
  .hero .date{font-size:13px; color:#B7B2A7}

  .wrap{padding:0 18px}
  .sect-top{display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 12px}
  .sect-top h2{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:19px; margin:0}
  .sect-top .rule{height:3px; width:34px; background:var(--black); margin-top:6px}
  .link{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--ink); background:none; border:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px}

  /* stat row */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:16px 18px 0}
  .stat{background:var(--paper); border:1px solid var(--border); border-radius:14px; padding:12px 12px 11px; text-align:left}
  .stat .n{font-family:var(--cond); font-weight:800; font-size:27px; line-height:1}
  .stat .n.warn{color:var(--crit)}
  .stat .l{font-size:10.5px; color:var(--gray); margin-top:5px; line-height:1.2; letter-spacing:.01em}

  /* quick tiles */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .tile{
    display:flex; flex-direction:column; gap:12px; align-items:flex-start;
    background:var(--paper); border:1px solid var(--border); border-radius:16px;
    padding:15px 15px 14px; cursor:pointer; text-align:left; min-height:104px; color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .tile:hover{box-shadow:var(--shadow-sm); border-color:#C4BFB4}
  .tile:active{transform:scale(.975)}
  .tile .ic{width:30px; height:30px; color:var(--black)}
  .tile .tt{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:15.5px; line-height:1.02}
  .tile .sb{font-size:11px; color:var(--gray); margin-top:-6px}

  .cta{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    margin-top:14px; padding:15px; border-radius:14px; cursor:pointer;
    font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:15px;
    background:var(--cream); color:var(--crit); border:1.5px solid var(--crit);
  }
  .cta:active{transform:scale(.99)}
  .cta .ic{width:20px;height:20px}

  /* generic list */
  .list{display:flex; flex-direction:column; gap:9px}
  .card{background:var(--paper); border:1px solid var(--border); border-radius:14px; padding:13px 14px; cursor:pointer; transition:border-color .12s}
  .card:hover{border-color:#C4BFB4}
  .card.flat{cursor:default}
  .row{display:flex; align-items:center; gap:12px}
  .row .grow{flex:1; min-width:0}
  .card .t1{font-family:var(--cond); font-weight:700; font-size:15.5px; text-transform:uppercase; letter-spacing:.02em; line-height:1.05}
  .card .t2{font-size:12.5px; color:var(--gray); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--border);display:inline-block}
  .who{display:inline-flex; align-items:center; gap:5px}
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--black);color:var(--off);font-family:var(--cond);font-weight:700;font-size:10px;display:grid;place-items:center}

  .daygroup{margin-top:6px}
  .dayhead{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:var(--gray); margin:16px 2px 9px}

  /* chips */
  .chip{display:inline-flex; align-items:center; gap:5px; font-family:var(--cond); font-weight:700; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap; border:1px solid transparent}
  .chip .cd{width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.ok{background:var(--ok-bg); color:var(--ok)}
  .chip.warn{background:var(--warn-bg); color:var(--warn)}
  .chip.crit{background:var(--crit-bg); color:var(--crit)}
  .chip.info{background:var(--info-bg); color:var(--info)}
  .chip.mute{background:var(--paper-2); color:var(--gray)}
  .chip.ink{background:var(--black); color:var(--off)}

  .empty{text-align:center; color:var(--gray); font-size:13.5px; padding:40px 20px}
  .empty .big{font-family:var(--cond); font-weight:800; text-transform:uppercase; font-size:17px; color:var(--ink); margin-bottom:6px}

  /* ---------- tabbar ---------- */
  .tabbar{flex:none; display:grid; grid-template-columns:repeat(4,1fr); background:var(--cream); border-top:1px solid var(--border); padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .tab{appearance:none; border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; padding:5px 2px; color:var(--gray)}
  .tab .ic{width:23px;height:23px}
  .tab .lb{font-family:var(--cond); font-weight:700; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase}
  .tab.on{color:var(--black)}
  .tab.on .lb{color:var(--black)}

  /* ---------- bottom sheet ---------- */
  .scrim{position:absolute; inset:0; background:rgba(10,10,10,.42); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:20}
  .scrim.show{opacity:1; pointer-events:auto}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:21; background:var(--cream);
    border-radius:22px 22px 0 0; box-shadow:0 -10px 40px rgba(10,10,10,.28);
    transform:translateY(101%); transition:transform .3s cubic-bezier(.22,.9,.3,1);
    max-height:90%; display:flex; flex-direction:column;
  }
  .sheet.show{transform:none}
  @media (prefers-reduced-motion:reduce){ .sheet{transition:none} .scrim{transition:none} }
  .sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--border);margin:10px auto 2px}
  .sheet .sh-head{padding:8px 20px 6px; display:flex; align-items:center; gap:12px}
  .sheet .sh-head .ic{width:26px;height:26px;color:var(--black)}
  .sheet .sh-head h3{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:21px; margin:0}
  .sheet .sh-body{padding:12px 20px 4px; overflow-y:auto}
  .sheet .sh-foot{padding:14px 20px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:var(--cream)}

  .fieldlab{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:11.5px; color:var(--gray); margin:16px 0 8px}
  .choices{display:flex; flex-wrap:wrap; gap:8px}
  .choice{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:12.5px; padding:8px 13px; border-radius:11px; border:1px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink)}
  .choice.sel{background:var(--black); color:var(--off); border-color:var(--black)}
  textarea,input[type=text]{width:100%; font-family:var(--sans); font-size:14.5px; color:var(--ink); background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:12px 13px; resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--black); outline-offset:1px}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:10px}
  .toggle .lb{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:13.5px}
  .switch{position:relative; width:44px; height:26px; border-radius:20px; background:var(--border); border:0; cursor:pointer; transition:background .18s; flex:none}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .18s; box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .switch.on{background:var(--crit)} .switch.on::after{transform:translateX(18px)}

  .photo-btn{display:flex;align-items:center;gap:9px;width:100%;justify-content:center;padding:13px;border:1.5px dashed var(--border);border-radius:12px;background:var(--paper);cursor:pointer;color:var(--gray);font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}

  .btn-primary{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border:0;border-radius:14px;background:var(--black);color:var(--off);font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:16px;cursor:pointer}
  .btn-primary:active{transform:scale(.99)}
  .btn-primary.danger{background:var(--crit)}
  .btn-ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--ink);font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13.5px;cursor:pointer;margin-top:9px}

  /* detail lifecycle */
  .steps{display:flex;flex-direction:column;gap:0;margin:6px 0 4px}
  .step{display:flex;gap:12px;align-items:flex-start;padding:4px 0}
  .step .bullet{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center;color:var(--off);background:var(--cream);margin-top:1px}
  .step.done .bullet{background:var(--ok);border-color:var(--ok)}
  .step.cur .bullet{background:var(--black);border-color:var(--black)}
  .step .stbody .s1{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:13.5px}
  .step .stbody .s2{font-size:12px;color:var(--gray)}
  .step .conn{width:2px;background:var(--border);margin-left:10px;height:12px}
  .step.done + .step .conn{background:var(--ok)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}
  .kv .k{color:var(--gray)} .kv .v{font-weight:500;text-align:right}

  /* toast */
  .toast{position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px); z-index:40; background:var(--black); color:var(--off); border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:88%}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast .ic{width:20px;height:20px;color:#8fe0be;flex:none}
  .toast .tx{font-size:13px;line-height:1.3}
  .toast .tx b{font-family:var(--cond);font-weight:700;letter-spacing:.02em}

  /* success burst inside sheet */
  .burst{position:absolute;inset:0;background:var(--cream);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30}
  .burst.show{display:flex}
  .burst .ring{width:96px;height:96px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center;animation:pop .4s ease both}
  .burst .ring svg{width:52px;height:52px;color:var(--ok)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .burst .bt{font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:22px}
  .burst .bs{font-size:13px;color:var(--gray);margin-top:-8px}

  a{color:inherit}
  button:focus-visible,.tile:focus-visible,.card:focus-visible,.choice:focus-visible{outline:2px solid var(--black); outline-offset:2px}
  .demo-flag{font-size:10.5px;color:#B7B2A7;text-align:center;padding:10px 20px 2px;letter-spacing:.02em}
</style>

</div>

<script>
/* ============================ ICONES ============================ */
const IC = {
  tatami:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
  changing:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/></svg>',

  restroom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a3 3 0 0 0 3 3v9"/><path d="M6 12a3 3 0 0 0 0-6"/><path d="M18 3l-2 9h4l-2-9Z"/><path d="M18 12v9"/></svg>',

  firstaid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4h8v2"/><path d="M12 10v6M9 13h6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1H9Z"/><path d="M9 11h6M9 15h4"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>'
};

/* ============================ DONNEES ============================ */
const OP_TYPES = [
  {code:'training_surface_cleaning', name:'Tatami', full:'Nettoyage surface d\'entraînement', icon:'tatami',   zone:true},
  {code:'changing_room_cleaning',    name:'Vestiaire', full:'Nettoyage vestiaire',            icon:'changing', zone:true},
  {code:'shower_cleaning',           name:'Douches', full:'Nettoyage douches',                icon:'shower',   zone:true},
  {code:'restroom_cleaning',         name:'Sanitaires', full:'Nettoyage sanitaires',          icon:'restroom', zone:true},
  {code:'shared_equipment_cleaning', name:'Équipement', full:'Nettoyage équipement partagé',  icon:'equip',    zone:true},
  {code:'first_aid_check',           name:'1ers secours', full:'Vérification premiers secours',icon:'firstaid',zone:true}
];
const ZONES = ['Tatami principal','Tatami 2','Vestiaire hommes','Vestiaire femmes','Douches','Sanitaires','Réception','Premiers secours'];
const ANO_CATS = [['hygiene','Hygiène'],['equipment','Équipement'],['product','Produit'],['damage','Dégât'],['installation','Installation'],['first_aid','1ers secours'],['other','Autre']];
const PRIOS = [['low','Basse'],['normal','Normale'],['high','Haute'],['critical','Critique']];
const CTL_TYPES = [['first_aid_kit_check','Trousse de secours'],['products_check','Produits d\'entretien'],['equipment_check','Équipements'],['documentation_check','Documentation']];
const USER = {name:'Rémy Lassalle', initials:'RL', role:'Référent Hygiène'};

const STORE='matsafe_demo_v2';
let db;

function seed(){
  const now=Date.now(), H=3600e3, D=24*H;
  return {
    ops:[
      {id:id(), type:'training_surface_cleaning', zone:'Tatami principal', by:'Rémy L.', at:now-1.5*H, anomaly:false},
      {id:id(), type:'shower_cleaning', zone:'Douches', by:'Karim B.', at:now-3*H, anomaly:false},
      {id:id(), type:'restroom_cleaning', zone:'Sanitaires', by:'Karim B.', at:now-5*H, anomaly:true},
      {id:id(), type:'changing_room_cleaning', zone:'Vestiaire hommes', by:'Rémy L.', at:now-1*D-2*H, anomaly:false},
      {id:id(), type:'training_surface_cleaning', zone:'Tatami 2', by:'Léa M.', at:now-1*D-4*H, anomaly:false}
    ],
    anos:[
      {id:id(), zone:'Sanitaires', cat:'product', prio:'high', desc:'Plus de savon dans les sanitaires hommes.', by:'Karim B.', at:now-5*H, status:'open'},
      {id:id(), zone:'Tatami principal', cat:'damage', prio:'normal', desc:'Angle du tatami légèrement décollé côté cage.', by:'Rémy L.', at:now-2*D, status:'in_progress'},
      {id:id(), zone:'Douches', cat:'hygiene', prio:'critical', desc:'Moisissure visible dans la douche 3.', by:'Léa M.', at:now-6*D, status:'closed'}
    ],
    ctls:[
      {id:id(), type:'first_aid_kit_check', zone:'Premiers secours', due:now-1*D, status:'scheduled'},
      {id:id(), type:'products_check', zone:'Réserve', due:now+1*D, status:'scheduled'},
      {id:id(), type:'equipment_check', zone:'Tatami principal', due:now+5*D, status:'scheduled'},
      {id:id(), type:'documentation_check', zone:null, due:now-3*D, status:'completed', result:'ok'}
    ]
  };
}
function id(){return Math.random().toString(36).slice(2,10)}
function load(){ try{const r=localStorage.getItem(STORE); if(r){return JSON.parse(r)}}catch(e){} return seed(); }
function save(){ try{localStorage.setItem(STORE, JSON.stringify(db))}catch(e){} }

/* ============================ HELPERS ============================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const opType=c=>OP_TYPES.find(o=>o.code===c)||{name:c,full:c,icon:'check'};
const ctlName=c=>(CTL_TYPES.find(t=>t[0]===c)||[c,c])[1];
const catName=c=>(ANO_CATS.find(t=>t[0]===c)||[c,c])[1];
const prioName=p=>(PRIOS.find(t=>t[0]===p)||[p,p])[1];
function timeFmt(ts){const d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function isToday(ts){const d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()}
function isYesterday(ts){const d=new Date(ts),n=new Date(Date.now()-864e5);return d.toDateString()===n.toDateString()}
function dayLabel(ts){if(isToday(ts))return "Aujourd'hui";if(isYesterday(ts))return 'Hier';return new Date(ts).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function dateLong(ts){return new Date(ts).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}

const ANO_FLOW=[['open','Ouverte'],['in_progress','En cours'],['corrected','Corrigée'],['verified','Vérifiée'],['closed','Clôturée']];
function anoChip(s){
  const map={open:['crit','Ouverte'],in_progress:['warn','En cours'],corrected:['info','Corrigée'],verified:['info','Vérifiée'],closed:['mute','Clôturée']};
  const [c,l]=map[s]||['mute',s]; return `<span class="chip ${c}"><span class="cd"></span>${l}</span>`;
}
function prioChip(p){const map={low:'mute',normal:'mute',high:'warn',critical:'crit'};return `<span class="chip ${map[p]||'mute'}">${prioName(p)}</span>`}
function ctlStatus(c){
  if(c.status==='completed')return['ok','Fait'];
  if(c.status==='cancelled')return['mute','Annulé'];
  if(c.due < Date.now())return['crit','En retard'];
  if(c.due <= Date.now()+864e5)return['warn','À faire'];
  return['info','Planifié'];
}

/* ============================ RENDER ============================ */
function render(){
  $('#clubName').textContent='Cube Fight Club';
  $('#roleName').textContent=USER.role;
  $('#todayDate').textContent=dateLong(Date.now());

  const opsToday=db.ops.filter(o=>isToday(o.at)).length;
  const anoOpen=db.anos.filter(a=>a.status!=='closed').length;
  const ctlDue=db.ctls.filter(c=>c.status==='scheduled' && c.due<=Date.now()+864e5).length;
  $('#stOps').textContent=opsToday;
  $('#stAno').textContent=anoOpen;
  $('#stCtl').textContent=ctlDue;

  // tiles
  $('#tiles').innerHTML=OP_TYPES.map(o=>`
    <button class="tile" data-op="${o.code}">
      <span class="ic">${IC[o.icon]}</span>
      <span><span class="tt">${o.name}</span></span>
    </button>`).join('');

  // recent (home)
  const recent=[...db.ops].sort((a,b)=>b.at-a.at).slice(0,3);
  $('#homeRecent').innerHTML=recent.map(opRow).join('') || emptyBox('Aucune opération');

  // registre grouped
  const sorted=[...db.ops].sort((a,b)=>b.at-a.at);
  let html='', lastDay='';
  sorted.forEach(o=>{const dl=dayLabel(o.at); if(dl!==lastDay){html+=`<div class="dayhead">${dl}</div>`; lastDay=dl;} html+=opRow(o);});
  $('#regList').innerHTML=html || emptyBox('Registre vide');

  // anomalies
  const anos=[...db.anos].sort((a,b)=>b.at-a.at);
  $('#anoList').innerHTML=anos.map(a=>`
    <div class="card" data-ano="${a.id}">
      <div class="row">
        <div class="grow">
          <div class="t1">${catName(a.cat)} · ${a.zone}</div>
          <div class="t2">${escapeHtml(a.desc)}</div>
          <div class="t2" style="margin-top:7px">${anoChip(a.status)} ${prioChip(a.prio)} <span class="dot"></span> ${dayLabel(a.at)}</div>
        </div>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#B0AA9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>`).join('') || emptyBox('Aucune anomalie 🎉','Tout est en ordre.');

  // controls
  const ctls=[...db.ctls].sort((a,b)=>a.due-b.due);
  $('#ctlList').innerHTML=ctls.map(c=>{const [cc,cl]=ctlStatus(c);return `
    <div class="card" data-ctl="${c.id}">
      <div class="row">
        <span class="ic" style="width:26px;height:26px;color:var(--black);flex:none">${IC.clip}</span>
        <div class="grow">
          <div class="t1">${ctlName(c.type)}</div>
          <div class="t2">${c.zone?c.zone+' · ':''}échéance ${new Date(c.due).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div>
        </div>
        <span class="chip ${cc}"><span class="cd"></span>${cl}</span>
      </div>
    </div>`}).join('') || emptyBox('Aucun contrôle');

  save();
}
function opRow(o){const t=opType(o.type);return `
  <div class="card flat">
    <div class="row">
      <span class="ic" style="width:26px;height:26px;color:var(--black);flex:none">${IC[t.icon]}</span>
      <div class="grow">
        <div class="t1">${t.full}</div>
        <div class="t2"><span>${o.zone||'—'}</span> <span class="dot"></span> <span class="who"><span class="avatar">${initials(o.by)}</span>${o.by}</span></div>
      </div>
      <div style="text-align:right;flex:none">
        <div style="font-family:var(--cond);font-weight:700;font-size:14px">${timeFmt(o.at)}</div>
        ${o.anomaly?'<span class="chip crit" style="margin-top:4px"><span class="cd"></span>Anomalie</span>':'<span class="chip ok" style="margin-top:4px">OK</span>'}
      </div>
    </div>
  </div>`;
}
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function emptyBox(big,sub=''){return `<div class="empty"><div class="big">${big}</div>${sub}</div>`}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ============================ NAV ============================ */
function goto(tab){
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#s-'+tab).classList.add('active');
  $('main').scrollTop=0;
}
$('#tabbar').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b)goto(b.dataset.tab);});
document.addEventListener('click',e=>{const g=e.target.closest('[data-goto]'); if(g)goto(g.dataset.goto);});

/* ============================ SHEET ============================ */
let sheetFoot=null;
function openSheet(icon,title,bodyHtml,footHtml){
  $('#shIcon').innerHTML=IC[icon]||'';
  $('#shTitle').textContent=title;
  $('#shBody').innerHTML=bodyHtml;
  $('#shFoot').innerHTML=footHtml||'';
  $('#burst').classList.remove('show');
  $('#scrim').classList.add('show'); $('#sheet').classList.add('show');
}
function closeSheet(){$('#scrim').classList.remove('show'); $('#sheet').classList.remove('show');}
$('#scrim').addEventListener('click',closeSheet);

/* choix (chips) */
document.addEventListener('click',e=>{
  const ch=e.target.closest('.choice'); if(!ch)return;
  const grp=ch.parentElement;
  if(grp.dataset.multi==='1'){ch.classList.toggle('sel');return;}
  $$('.choice',grp).forEach(c=>c.classList.remove('sel')); ch.classList.add('sel');
});
/* switch */
document.addEventListener('click',e=>{const sw=e.target.closest('.switch'); if(sw)sw.classList.toggle('on');});

/* ============================ VALIDATION EXPRESS ============================ */
function openValidate(code){
  const t=opType(code);
  const zoneChips=ZONES.map((z,i)=>`<button class="choice ${i===0?'sel':''}" data-z="${z}">${z}</button>`).join('');
  const body=`
    ${t.zone?`<div class="fieldlab">Zone concernée</div><div class="choices" id="zoneGrp">${zoneChips}</div>`:''}
    <div class="toggle"><span class="lb">Anomalie détectée&nbsp;?</span><button class="switch" id="anoSw" aria-label="Anomalie détectée"></button></div>
    <div class="fieldlab">Commentaire (facultatif)</div>
    <textarea id="opComment" rows="2" placeholder="Ex : produit X utilisé, RAS…"></textarea>`;
  const foot=`<button class="btn-primary" id="doValidate"><span style="width:20px;height:20px">${IC.check}</span>Valider · ${t.name}</button>`;
  openSheet(t.icon,t.full,body,foot);
  $('#doValidate').onclick=()=>{
    const zone = t.zone ? ($('.choice.sel',$('#zoneGrp'))?.dataset.z||ZONES[0]) : null;
    const anomaly = $('#anoSw').classList.contains('on');
    const comment = $('#opComment').value.trim();
    const now=Date.now();
    db.ops.unshift({id:id(), type:code, zone, by:USER.name.split(' ')[0]+' '+USER.name.split(' ')[1][0]+'.', at:now, anomaly, comment});
    if(anomaly){ db.anos.unshift({id:id(), zone:zone||'—', cat:'hygiene', prio:'normal', desc:comment||('Anomalie signalée lors de : '+t.full), by:USER.name.split(' ')[0]+' L.', at:now, status:'open'}); }
    render();
    showBurst('Enregistré', `${t.name} · ${zone||''} · ${timeFmt(now)}`);
  };
}
function showBurst(title,sub){
  $('#burstTitle').textContent=title; $('#burstSub').textContent=sub;
  $('#burst').classList.add('show');
  setTimeout(()=>{ closeSheet(); toast(`<b>${title}</b> · ${sub}`); }, 1050);
}

/* ============================ SIGNALER ANOMALIE ============================ */
function openReport(){
  const zoneChips=ZONES.map((z,i)=>`<button class="choice ${i===0?'sel':''}" data-z="${z}">${z}</button>`).join('');
  const catChips=ANO_CATS.map((c,i)=>`<button class="choice ${i===0?'sel':''}" data-c="${c[0]}">${c[1]}</button>`).join('');
  const prioChips=PRIOS.map((p)=>`<button class="choice ${p[0]==='normal'?'sel':''}" data-p="${p[0]}">${p[1]}</button>`).join('');
  const body=`
    <div class="fieldlab">Zone</div><div class="choices" id="rZone">${zoneChips}</div>
    <div class="fieldlab">Catégorie</div><div class="choices" id="rCat">${catChips}</div>
    <div class="fieldlab">Priorité</div><div class="choices" id="rPrio">${prioChips}</div>
    <div class="fieldlab">Description</div>
    <textarea id="rDesc" rows="3" placeholder="Décris le problème constaté…"></textarea>
    <div class="fieldlab">Photo (facultative)</div>
    <button class="photo-btn" type="button" onclick="toast('📷 Ajout de photo — disponible avec l\\'app connectée')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L8 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4Z"/><circle cx="12" cy="13" r="3.5"/></svg>Ajouter une photo</button>`;
  const foot=`<button class="btn-primary danger" id="doReport"><span style="width:20px;height:20px">${IC.warn}</span>Envoyer le signalement</button>`;
  openSheet('warn','Signaler une anomalie',body,foot);
  $('#doReport').onclick=()=>{
    const desc=$('#rDesc').value.trim();
    if(!desc){ $('#rDesc').focus(); $('#rDesc').style.borderColor='var(--crit)'; return; }
    const now=Date.now();
    db.anos.unshift({
      id:id(), zone:$('.choice.sel',$('#rZone'))?.dataset.z||ZONES[0],
      cat:$('.choice.sel',$('#rCat'))?.dataset.c||'other',
      prio:$('.choice.sel',$('#rPrio'))?.dataset.p||'normal',
      desc, by:USER.name.split(' ')[0]+' L.', at:now, status:'open'
    });
    render();
    showBurst('Anomalie signalée','Ajoutée au suivi · statut Ouverte');
  };
}
$('#reportCta').onclick=openReport;
$('#reportCta2').onclick=openReport;
document.addEventListener('click',e=>{const b=e.target.closest('[data-op]'); if(b)openValidate(b.dataset.op);});

/* ============================ DETAIL ANOMALIE ============================ */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-ano]'); if(!c)return;
  const a=db.anos.find(x=>x.id===c.dataset.ano); if(!a)return;
  const curIdx=ANO_FLOW.findIndex(f=>f[0]===a.status);
  const steps=ANO_FLOW.map((f,i)=>`
    <div class="step ${i<curIdx?'done':''} ${i===curIdx?'cur':''}">
      <div class="bullet">${i<curIdx?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':''}</div>
      <div class="stbody"><div class="s1">${f[1]}</div></div>
    </div>${i<ANO_FLOW.length-1?'<div class="conn"></div>':''}`).join('');
  const body=`
    <div style="margin:2px 0 12px">${anoChip(a.status)} ${prioChip(a.prio)}</div>
    <p style="font-size:14.5px;line-height:1.5;margin:0 0 4px">${escapeHtml(a.desc)}</p>
    <div class="kv"><span class="k">Catégorie</span><span class="v">${catName(a.cat)}</span></div>
    <div class="kv"><span class="k">Zone</span><span class="v">${a.zone}</span></div>
    <div class="kv"><span class="k">Signalée par</span><span class="v">${a.by}</span></div>
    <div class="kv"><span class="k">Le</span><span class="v">${dateLong(a.at)} · ${timeFmt(a.at)}</span></div>
    <div class="fieldlab">Cycle de vie</div>
    <div class="steps">${steps}</div>`;
  let foot='';
  if(a.status!=='closed'){
    const next=ANO_FLOW[curIdx+1];
    foot=`<button class="btn-primary" id="advAno"><span style="width:20px;height:20px">${IC.check}</span>Marquer : ${next[1]}</button>`;
  }else{
    foot=`<button class="btn-ghost" onclick="closeSheet()">Fermer</button>`;
  }
  openSheet('warn', catName(a.cat), body, foot);
  const adv=$('#advAno');
  if(adv)adv.onclick=()=>{ a.status=ANO_FLOW[curIdx+1][0]; render(); closeSheet(); toast(`<b>Anomalie mise à jour</b> · ${ANO_FLOW[curIdx+1][1]}`); };
});

/* ============================ DETAIL CONTROLE ============================ */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-ctl]'); if(!c)return;
  const ctl=db.ctls.find(x=>x.id===c.dataset.ctl); if(!ctl)return;
  const [cc,cl]=ctlStatus(ctl);
  const done=ctl.status==='completed';
  const body=`
    <div style="margin:2px 0 12px"><span class="chip ${cc}"><span class="cd"></span>${cl}</span></div>
    <div class="kv"><span class="k">Zone</span><span class="v">${ctl.zone||'—'}</span></div>
    <div class="kv"><span class="k">Échéance</span><span class="v">${dateLong(ctl.due)}</span></div>
    ${done?`<div class="kv"><span class="k">Résultat</span><span class="v">${ctl.result==='ok'?'Conforme':'Non conforme'}</span></div>`:`
    <div class="fieldlab">Résultat du contrôle</div>
    <div class="choices" id="ctlRes"><button class="choice sel" data-r="ok">Conforme</button><button class="choice" data-r="not_ok">Non conforme</button></div>`}`;
  const foot=done?`<button class="btn-ghost" onclick="closeSheet()">Fermer</button>`
    :`<button class="btn-primary" id="doCtl"><span style="width:20px;height:20px">${IC.check}</span>Marquer comme fait</button>`;
  openSheet('clip', ctlName(ctl.type), body, foot);
  const d=$('#doCtl');
  if(d)d.onclick=()=>{ const res=$('.choice.sel',$('#ctlRes'))?.dataset.r||'ok'; ctl.status='completed'; ctl.result=res; ctl.completedAt=Date.now();
    if(res==='not_ok'){ db.anos.unshift({id:id(),zone:ctl.zone||'—',cat:'equipment',prio:'high',desc:'Non-conformité relevée lors du contrôle : '+ctlName(ctl.type),by:USER.name.split(' ')[0]+' L.',at:Date.now(),status:'open'}); }
    render(); showBurst('Contrôle enregistré', ctlName(ctl.type)+' · '+(res==='ok'?'Conforme':'Non conforme')); };
});

/* ============================ TOAST + RESET ============================ */
let toastT;
function toast(html){ $('#toastTx').innerHTML=html; $('#toast').classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>$('#toast').classList.remove('show'),2600); }
$('#resetBtn').onclick=()=>{ if(confirm('Réinitialiser les données de démonstration ?')){ db=seed(); render(); goto('home'); toast('<b>Démo réinitialisée</b>'); } };

render();
