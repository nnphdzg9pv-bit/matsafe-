<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatSafe Fondateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A; --ink:#0A0A0A; --off:#F2F0EC; --cream:#F2F0EC;
    --paper:#FAF9F5; --paper-2:#ECE9E2;
    --gray:#6F6A60; --faint:#9A9488; --light:#E8E6E1;
    --border:#CFC9BD; --hair:#E0DCD3;
    --ok:#2F6B4F;  --ok-bg:#E6EFE9;
    --warn:#9A5B12; --warn-bg:#F2E8D6;
    --crit:#A5341F; --crit-bg:#F1DED8;
    --info:#3C4A66; --info-bg:#E4E7EE;
    --brand:#C83830; --brand-strong:#AE2E23;
    --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --sans:"Barlow","Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; font-family:var(--sans); color:var(--ink); background:var(--cream);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
  img{max-width:100%}
  [hidden]{display:none!important}
  h1,h2,h3{margin:0}
  button{font-family:inherit}

  .app{display:flex; flex-direction:column; min-height:100dvh; background:var(--cream)}

  /* topbar (mobile) */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 16px; border-bottom:1px solid var(--border); background:var(--cream); position:sticky; top:0; z-index:20}
  .brand{display:flex; align-items:center; gap:10px}
  .brand .mark{height:22px; width:auto; display:block}
  .brand .role{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.10em; font-size:12px; color:var(--brand); border-left:1px solid var(--border); padding-left:10px}
  .menutgl{appearance:none; border:1px solid var(--border); background:transparent; width:38px;height:38px;border-radius:9px; display:grid;place-items:center;cursor:pointer;color:var(--ink)}

  .shell{display:flex; flex:1 1 auto; min-height:0}
  /* sidebar */
  .sidebar{flex:none; width:250px; border-right:1px solid var(--border); background:var(--cream); padding:24px 18px; display:flex; flex-direction:column; gap:6px}
  .sidebar .logo{display:flex; align-items:center; gap:10px; margin:2px 4px 20px}
  .sidebar .logo .mark{height:24px}
  .sidebar .logo .role{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.10em; font-size:12px; color:var(--brand); border-left:1px solid var(--border); padding-left:10px}
  .snav{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0; cursor:pointer;
    font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:14px; color:var(--gray);
    padding:11px 12px; border-radius:10px}
  .snav svg{width:18px;height:18px;flex:none;opacity:.8}
  .snav:hover{color:var(--ink); background:rgba(10,10,10,.04)}
  .snav.on{color:var(--ink); background:var(--black); color:var(--off)}
  .snav.on svg{opacity:1}
  .sidebar .spacer{flex:1 1 auto}
  .sidebar .who{margin:0 4px; padding-top:16px; border-top:1px solid var(--hair)}
  .sidebar .who .n{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:13px}
  .sidebar .who .r{font-size:11.5px; color:var(--gray)}

  main{flex:1 1 auto; min-width:0; overflow-y:auto; padding:30px clamp(16px,4vw,46px) 60px}
  .wrap{max-width:1080px; margin:0 auto}

  .phead{border-top:3px solid var(--ink); padding-top:15px; margin-bottom:8px}
  .phead .eyebrow{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--gray)}
  .phead h1{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.004em; font-size:clamp(30px,5vw,48px); line-height:.94; margin:5px 0 6px; overflow-wrap:anywhere}
  .phead .man{font-size:14.5px; color:var(--gray); line-height:1.5; max-width:640px}
  .backlink{display:inline-flex; align-items:center; gap:7px; background:none; border:0; cursor:pointer; color:var(--gray);
    font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:12px; padding:0; margin-bottom:14px}

  /* KPI tiles */
  .tiles{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border);
    border:1px solid var(--border); border-radius:14px; overflow:hidden; margin:22px 0}
  @media (max-width:980px){ .tiles{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:540px){ .tiles{grid-template-columns:repeat(2,1fr)} }
  .tile{background:var(--paper); padding:16px 16px 15px}
  .tile .k{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--gray)}
  .tile .v{font-family:var(--cond); font-weight:900; font-size:34px; line-height:1; margin:7px 0 3px; letter-spacing:.005em}
  .tile .v small{font-size:16px; font-weight:800; color:var(--gray)}
  .tile .s{font-size:12px; color:var(--faint)}
  .bar{height:6px; border-radius:6px; background:var(--paper-2); overflow:hidden; margin-top:9px}
  .bar > i{display:block; height:100%; background:var(--ink)}

  .sect-t{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:13px; color:var(--gray); margin:30px 0 4px}

  /* club rows */
  .clist{margin-top:2px}
  .crow{display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:none; border:0; cursor:pointer;
    padding:17px 4px; border-top:1px solid var(--hair); color:var(--ink)}
  .crow:hover{background:rgba(10,10,10,.025)}
  .crow .nm{min-width:0; flex:1 1 220px}
  .crow .nm .t{display:block; font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:19px; line-height:1.02}
  .crow .nm .c{display:block; font-size:12.5px; color:var(--gray); margin-top:4px}
  .crow .mini{display:flex; gap:20px; flex:0 0 auto; flex-wrap:wrap}
  .mcol{min-width:64px}
  .mcol .mk{display:block; font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:10px; color:var(--faint)}
  .mcol .mv{display:block; font-family:var(--cond); font-weight:800; font-size:17px; line-height:1; margin-top:4px}
  .crow .arr{opacity:.4; flex:none}
  @media (max-width:720px){ .crow .mini{display:none} }

  .badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:11px; padding:4px 10px; border-radius:999px; white-space:nowrap}
  .badge .d{width:7px;height:7px;border-radius:50%}
  .b-ok{background:var(--ok-bg); color:var(--ok)} .b-ok .d{background:var(--ok)}
  .b-warn{background:var(--warn-bg); color:var(--warn)} .b-warn .d{background:var(--warn)}
  .b-info{background:var(--info-bg); color:var(--info)} .b-info .d{background:var(--info)}

  /* callout */
  .callout{border:1px solid var(--border); background:var(--paper); border-radius:14px; padding:16px 18px; margin:18px 0}
  .callout.warm{background:var(--warn-bg); border-color:#E4D3B4}
  .callout .h{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:12px; margin-bottom:6px}
  .callout p{margin:0; font-size:13px; line-height:1.5; color:var(--ink)}
  .callout.warm p{color:#6a4410}

  /* accompaniment rows */
  .acc-row{display:flex; gap:14px; align-items:flex-start; padding:15px 4px; border-top:1px solid var(--hair)}
  .acc-row .step{font-family:var(--cond); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--warn); background:var(--warn-bg); border-radius:999px; padding:4px 10px; white-space:nowrap; flex:none}
  .acc-row .body{min-width:0}
  .acc-row .body .t{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.01em; font-size:16px}
  .acc-row .body .d{font-size:13px; color:var(--gray); margin-top:3px; line-height:1.45}
  .acc-row .when{margin-left:auto; font-size:12px; color:var(--faint); white-space:nowrap; flex:none}
  @media (max-width:640px){ .acc-row .when{display:none} }

  /* detail two-col */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:12px}
  @media (max-width:820px){ .grid2{grid-template-columns:1fr} }
  .panel .pt{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:13px; color:var(--gray); border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:2px}
  .drow{display:flex; gap:12px; align-items:flex-start; padding:12px 2px; border-top:1px solid var(--hair)}
  .drow:first-of-type{border-top:0}
  .drow .dt{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:14px}
  .drow .ds{font-size:12.5px; color:var(--gray); margin-top:2px; line-height:1.4}
  .drow .dk{margin-left:auto; font-size:11px; font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .k-open{background:var(--warn-bg); color:var(--warn)} .k-closed{background:var(--ok-bg); color:var(--ok)} .k-verify{background:var(--info-bg); color:var(--info)}

  /* zones breakdown */
  .zb{display:flex; align-items:center; gap:10px; padding:8px 2px}
  .zb .zn{font-size:13px; width:170px; flex:none}
  .zb .zbar{flex:1 1 auto; height:8px; border-radius:8px; background:var(--paper-2); overflow:hidden}
  .zb .zbar > i{display:block;height:100%;background:var(--brand)}
  .zb .zc{font-family:var(--cond); font-weight:800; font-size:14px; width:26px; text-align:right}

  /* registre sparkbars */
  .spark{display:flex; align-items:flex-end; gap:5px; height:46px; margin-top:6px}
  .spark > i{flex:1 1 auto; background:var(--ink); border-radius:2px 2px 0 0; min-height:2px; opacity:.85}

  .btn{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:14px; padding:13px 20px; border-radius:11px; border:1px solid var(--black); background:var(--black); color:var(--off); cursor:pointer}
  .btn.ghost{background:transparent; color:var(--ink)}
  .btn.sm{padding:9px 14px; font-size:12px; border-radius:9px}
  .actbar{display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 4px}

  /* modal / bilan */
  .scrim{position:fixed; inset:0; background:rgba(10,10,10,.44); z-index:40; display:none}
  .scrim.on{display:block}
  .modal{position:fixed; z-index:41; inset:0; display:none; align-items:flex-start; justify-content:center; padding:26px 16px; overflow-y:auto}
  .modal.on{display:flex}
  .card{background:var(--cream); border:1px solid var(--border); border-radius:16px; width:100%; max-width:680px; box-shadow:0 30px 70px rgba(0,0,0,.3)}
  .card .ch{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px; border-bottom:1px solid var(--hair)}
  .card .ch .t{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.01em; font-size:20px}
  .card .cx{appearance:none; border:1px solid var(--border); background:transparent; width:34px;height:34px;border-radius:9px; cursor:pointer; color:var(--ink); font-size:18px}
  .card .cb{padding:8px 22px 4px}
  .card .cf{padding:14px 22px 20px; border-top:1px solid var(--hair); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

  .bilan .bblock{padding:15px 0; border-top:1px solid var(--hair)}
  .bilan .bblock:first-child{border-top:0}
  .bilan .bt{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.04em; font-size:13px; color:var(--brand); margin-bottom:6px}
  .bilan .bp{font-size:14px; line-height:1.55; color:var(--ink); margin:0}
  .bilan ul{margin:7px 0 0; padding-left:18px} .bilan li{font-size:13.5px; line-height:1.5; margin:3px 0}
  .bilan .tone{font-style:italic; color:var(--gray); font-size:13px; background:var(--paper); border-radius:10px; padding:11px 13px; margin-top:8px}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--hair); font-size:11.5px; color:var(--faint); line-height:1.5; max-width:720px}
  .foot b{color:var(--gray); font-weight:600}

  @media (max-width:900px){
    .sidebar{display:none}
    .sidebar.open{display:flex; position:fixed; z-index:30; top:0; bottom:0; left:0; width:260px; box-shadow:0 0 60px rgba(0,0,0,.25)}
    .sidebar.open .logo{display:none}
    .scrim.navon{display:block; z-index:25}
  }
  @media (min-width:901px){ .topbar{display:none} }

  /* print (bilan only) */
  #printArea{display:none}
  @media print{
    .app,.scrim,.modal{display:none!important}
    #printArea{display:block!important; padding:0; color:#111}
    #printArea .rp-brand{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:15px; color:#C83830}
    #printArea h2{font-family:var(--cond); text-transform:uppercase; font-size:26px; margin:6px 0 2px}
    #printArea .bt{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.04em; font-size:13px; color:#C83830; margin-top:16px}
    #printArea .bp{font-size:13px; line-height:1.5; margin:5px 0}
    #printArea ul{margin:5px 0; padding-left:18px} #printArea li{font-size:12.5px; line-height:1.45}
    #printArea .meta{color:#666; font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    var fighter=CLUBS.reduce(function(a,c){return a+c.fighter30;},0);
    var resol=(CLUBS.reduce(function(a,c){return a+c.resolJ;},0)/nClubs).toFixed(1);
    var accClubs=CLUBS.filter(function(c){return c.acc.length;});
    var toAccompany=CLUBS.filter(function(c){return c.status==='warn';});

    var tiles=
      tile('Établissements labellisés', nClubs, '', 0)+
      tile('Réalisation réseau', taux, '%', taux)+
      tile('Anomalies ouvertes', anoOpen, '', 0)+
      tile('Retours Fighter (30 j)', fighter, '', 0)+
      tile('Résolution moyenne', resol, ' j', 0)+
      tile('Accompagnements en cours', accClubs.length, '', 0);

    var accBox = toAccompany.length ? (
      '<div class="callout warm"><div class="h">Méritent un échange</div><p>'+
      toAccompany.map(function(c){return '<b>'+esc(c.name)+'</b> — '+(c.recurring[0]?esc(c.recurring[0]):'tendance à observer');}).join(' · ')+
      '. L’objectif est d’aider à identifier la cause, pas de sanctionner.</p></div>') : '';

    view.innerHTML=
      '<div class="phead"><div class="eyebrow">Pilotage central du label</div>'+
        '<h1>Réseau MatSafe</h1>'+
        '<p class="man">Vue d’ensemble des établissements labellisés : utilisent-ils réellement le système et maîtrisent-ils leur hygiène dans la durée&nbsp;? Les indicateurs se lisent <b>ensemble</b> — réactivité, résolution et récidive avant tout.</p></div>'+
      '<div class="tiles">'+tiles+'</div>'+
      accBox+
      '<div class="sect-t">Établissements</div>'+
      '<div class="clist">'+CLUBS.map(clubRow).join('')+'</div>'+
      footNote();
    view.querySelectorAll('.crow').forEach(function(b){ b.onclick=function(){ go('fiche', b.dataset.id); }; });
  }

  function tile(k,v,unit,barPct){
    var bar = unit==='%' ? '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,barPct))+'%"></i></div>' : '';
    return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</div>'+bar+'</div>';
  }

  function clubRow(c){
    return '<button class="crow" data-id="'+c.id+'">'+
      '<span class="nm"><span class="t">'+esc(c.name)+'</span><span class="c">'+esc(c.city)+' · depuis '+esc(c.since)+'</span></span>'+
      '<span class="mini">'+
        mcol('Réalis.', tauxOf(c)+'%')+
        mcol('Anom. ouv.', c.anoOpen)+
        mcol('Fighter 30j', c.fighter30)+
        mcol('Résol. moy.', c.resolJ+' j')+
      '</span>'+
      badge(c.status)+
      '<span class="arr"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>'+
    '</button>';
  }
  function mcol(k,v){return '<span class="mcol"><span class="mk">'+esc(k)+'</span><span class="mv">'+v+'</span></span>';}

  /* ---------- Fiche établissement ---------- */
  function scrFiche(id){
    var c=byId(id); if(!c){ return scrReseau(); }
    var taux=tauxOf(c);
    var zmax=Math.max.apply(null,c.zones.map(function(z){return z[1];}).concat([1]));
    var rmax=Math.max.apply(null,c.registre.concat([1]));

    var indicators=
      tile('Réalisation (30 j)', taux, '%', taux)+
      tile('Anomalies ouvertes', c.anoOpen, '', 0)+
      tile('Plus ancienne', c.anoOldest, ' j', 0)+
      tile('Prise en compte', c.priseH, ' h', 0)+
      tile('Résolution moy.', c.resolJ, ' j', 0)+
      tile('Réapparues', c.reopened, '', 0);

    var recurringBox = c.recurring.length
      ? '<div class="callout warm"><div class="h">Problème récurrent</div><p>'+c.recurring.map(esc).join('<br>')+'. À approfondir avec le club — cause structurelle probable.</p></div>'
      : '<div class="callout"><div class="h">Récurrence</div><p>Aucun problème réapparu après correction sur la période. Bonne maîtrise dans la durée.</p></div>';

    var zones = c.zones.length
      ? c.zones.map(function(z){ return '<div class="zb"><span class="zn">'+esc(z[0])+'</span><span class="zbar"><i style="width:'+Math.round(z[1]/zmax*100)+'%"></i></span><span class="zc">'+z[1]+'</span></div>'; }).join('')
      : '<div class="ds" style="padding:10px 2px;color:var(--faint)">Aucun retour sur la période.</div>';

    var anomalies = c.anomalies.map(function(a){
      var kc=a.k==='open'?'k-open':(a.k==='verify'?'k-verify':'k-closed');
      var kl=a.k==='open'?'Ouverte':(a.k==='verify'?'À vérifier':'Clôturée');
      return '<div class="drow"><div><div class="dt">'+esc(a.t)+'</div><div class="ds">'+esc(a.s)+'</div></div><span class="dk '+kc+'">'+kl+'</span></div>';
    }).join('');

    var acc = c.acc.length
      ? c.acc.map(function(a){ return '<div class="acc-row"><span class="step">'+esc(a.step)+'</span><div class="body"><div class="t">'+esc(a.t)+'</div><div class="d">'+esc(a.d)+'</div></div><span class="when">'+esc(a.when)+'</span></div>'; }).join('')
      : '<div class="ds" style="padding:12px 2px;color:var(--faint)">Aucun accompagnement en cours.</div>';

    var audits = c.audits.map(function(a){ return '<div class="drow"><div><div class="dt">'+esc(a.t)+'</div><div class="ds">'+esc(a.s)+'</div></div></div>'; }).join('');

    view.innerHTML=
      '<button class="backlink" id="back"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Réseau</button>'+
      '<div class="phead"><div class="eyebrow">'+esc(c.city)+' · labellisé depuis '+esc(c.since)+'</div>'+
        '<h1>'+esc(c.name)+'</h1>'+
        '<div style="margin-top:8px">'+badge(c.status)+'</div></div>'+
      '<div class="actbar"><button class="btn" id="bilan">Générer le bilan mensuel</button>'+
        (c.status==='warn'?'<button class="btn ghost" id="engage">Engager un échange</button>':'')+'</div>'+
      '<div class="tiles">'+indicators+'</div>'+
      '<div class="callout"><div class="h">Lecture</div><p>Un volume de retours élevé n’est pas, seul, un signal négatif : une salle très fréquentée en reçoit davantage, et les traiter vite démontre une bonne organisation. On regarde la <b>réactivité</b>, la <b>résolution</b> et la <b>récidive</b>.</p></div>'+
      recurringBox+
      '<div class="grid2">'+
        '<div class="panel"><div class="pt">Retours Fighter (30 j) · '+c.fighter30+'</div>'+zones+'</div>'+
        '<div class="panel"><div class="pt">Activité du registre (8 sem.)</div>'+
          '<div class="spark">'+c.registre.map(function(v){return '<i style="height:'+Math.round(v/rmax*100)+'%"></i>';}).join('')+'</div>'+
          '<div class="ds" style="margin-top:8px">'+c.opsDone+' opérations tracées sur '+c.opsPlanned+' prévues.</div></div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div class="panel"><div class="pt">Anomalies</div>'+anomalies+'</div>'+
        '<div class="panel"><div class="pt">Accompagnements</div>'+acc+'</div>'+
      '</div>'+
      '<div class="panel" style="margin-top:26px"><div class="pt">Audits</div>'+audits+'</div>'+
      footNote();

    document.getElementById('back').onclick=function(){ go('reseau'); };
    document.getElementById('bilan').onclick=function(){ openBilan(c); };
    var eng=document.getElementById('engage'); if(eng) eng.onclick=function(){ openEngage(c); };
  }

  /* ---------- Accompagnement (réseau) ---------- */
  function scrAccompagnement(){
    var withAcc=CLUBS.filter(function(c){return c.acc.length;});
    var ladder=['Accompagnement','Action d’amélioration','Suivi','Contrôle complémentaire','Audit additionnel (exceptionnel)'];
    var rows=[];
    withAcc.forEach(function(c){ c.acc.forEach(function(a){
      rows.push('<div class="acc-row"><span class="step">'+esc(a.step)+'</span><div class="body"><div class="t">'+esc(c.name)+' — '+esc(a.t)+'</div><div class="d">'+esc(a.d)+'</div></div><span class="when">'+esc(a.when)+'</span></div>');
    });});
    view.innerHTML=
      '<div class="phead"><div class="eyebrow">Observer pour accompagner</div>'+
        '<h1>Accompagnement</h1>'+
        '<p class="man">La répétition d’un problème ne déclenche jamais de logique punitive : elle sert d’abord à identifier une difficulté structurelle, organisationnelle ou matérielle, et à proposer une solution durable.</p></div>'+
      '<div class="callout"><div class="h">Gradation raisonnable</div><p>'+ladder.map(function(s,i){return (i?' → ':'')+'<b>'+esc(s)+'</b>';}).join('')+'. Toute mesure plus forte reste exceptionnelle, objectivée et prévue par les règles du label.</p></div>'+
      '<div class="sect-t">En cours dans le réseau</div>'+
      '<div class="clist">'+(rows.length?rows.join(''):'<div class="ds" style="padding:14px 2px;color:var(--faint)">Aucun accompagnement en cours.</div>')+'</div>'+
      footNote();
  }

  /* ---------- Bilans mensuels ---------- */
  function scrBilans(){
    view.innerHTML=
      '<div class="phead"><div class="eyebrow">'+esc(MONTH)+'</div>'+
        '<h1>Bilans mensuels</h1>'+
        '<p class="man">Chaque fin de mois, chaque club reçoit automatiquement un bilan MATSAFE Network. Le ton est toujours constructif : reconnaître l’engagement d’abord, puis quelques axes concrets — jamais de classement ni de sanction automatique.</p></div>'+
      '<div class="sect-t">Générer / prévisualiser</div>'+
      '<div class="clist">'+CLUBS.map(function(c){
        return '<button class="crow" data-id="'+c.id+'"><span class="nm"><span class="t">'+esc(c.name)+'</span><span class="c">'+esc(c.city)+' · bilan '+esc(MONTH)+'</span></span>'+
          '<span class="badge b-info"><span class="d"></span>Prêt</span>'+
          '<span class="arr"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></button>';
      }).join('')+'</div>'+
      footNote();
    view.querySelectorAll('.crow').forEach(function(b){ b.onclick=function(){ openBilan(byId(b.dataset.id)); }; });
  }

  function scrApropos(){
    var avoid=['devenir un logiciel de gestion / planning / paiement / CRM','transformer Fighter en plateforme publique de notation',
      'surveiller les clubs de manière intrusive ou culpabilisante','déclencher une mesure automatique sur un simple nombre de commentaires',
      'modifier le référentiel sur quelques témoignages isolés','collecter des données personnelles ou médicales inutiles',
      'permettre l’effacement silencieux d’un historique gênant'];
    view.innerHTML=
      '<div class="phead"><div class="eyebrow">Ce qui guide l’interface</div>'+
        '<h1>Principes</h1>'+
        '<p class="man">MATSAFE ne se limite pas à contrôler l’hygiène à un instant donné : le dispositif suit comment elle est organisée, exécutée, corrigée et améliorée dans le temps.</p></div>'+
      '<div class="grid2">'+
        '<div class="panel"><div class="pt">On mesure</div>'+
          ['Taux de réalisation des opérations prévues','Anomalies ouvertes et ancienneté des non clôturées','Délai moyen de prise en compte et de résolution','Volume de retours Fighter et zones concernées','Problèmes récurrents ou réapparus après correction','Activité réelle du registre dans le temps']
            .map(function(t){return '<div class="drow"><div class="dt" style="font-weight:600;font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:14px">'+esc(t)+'</div></div>';}).join('')+'</div>'+
        '<div class="panel"><div class="pt">Ce que MATSAFE évite</div>'+
          avoid.map(function(t){return '<div class="drow"><div class="dt" style="font-weight:600;font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:14px;color:var(--gray)">'+esc(t)+'</div></div>';}).join('')+'</div>'+
      '</div>'+
      '<div class="callout" style="margin-top:24px"><div class="h">En interne</div><p>MATSAFE recherche des signaux utiles pour aider les établissements à conserver le niveau attendu par le label — <b>pas des fautes à sanctionner</b>. Territoire : hygiène · prévention · traçabilité · accompagnement · audit.</p></div>'+
      footNote();
  }

  function footNote(){
    return '<div class="foot"><b>MATSAFE Fondateur / Network</b> — interface privée de supervision de l’écosystème MatSafe (Control · Fighter · Fondateur). '+
      'Données inter-établissements réservées à MATSAFE. Chaque événement significatif reste historisé (qui, quoi, où, quand, dans quel état) ; une preuve ne peut être altérée sans laisser de trace.</div>';
  }

  /* ---------- Génération du bilan mensuel (§11) ---------- */
  function genBilan(c){
    var taux=tauxOf(c);
    var forts=[], consolider=[], suggestions=[];

    if(taux>=95) forts.push('Un registre tenu de façon très régulière ('+taux+'% des opérations prévues réalisées).');
    else if(taux>=85) forts.push('Une bonne régularité du registre ('+taux+'% des opérations prévues réalisées).');
    else consolider.push('Le taux de réalisation ('+taux+'%) peut encore progresser : quelques opérations prévues n’ont pas été tracées.');

    if(c.resolJ<=2) forts.push('Une prise en charge rapide des points remontés (résolution moyenne en '+c.resolJ+' j).');
    else consolider.push('Le délai de résolution moyen ('+c.resolJ+' j) mérite d’être resserré sur les points sensibles.');

    if(c.fighter30>=15) forts.push('Un dialogue actif avec les pratiquants ('+c.fighter30+' retours reçus), signe d’une salle vivante et à l’écoute.');

    if(c.reopened>0) consolider.push('Un point est réapparu après correction'+(c.recurring.length?' ('+c.recurring[0].toLowerCase()+')':'')+' : cela vaut la peine d’en chercher la cause de fond.');
    if(c.anoOldest>=14) consolider.push('Une anomalie ouverte depuis '+c.anoOldest+' j gagnerait à être clôturée.');

    if(c.recurring.length) suggestions.push('Sur la zone concernée, tester un protocole renforcé et planifier un point d’étape court ; MATSAFE peut vous appuyer.');
    if(taux<85) suggestions.push('Répartir certaines opérations sur des créneaux fixes pour fiabiliser le registre.');
    if(!suggestions.length) suggestions.push('Continuer sur cette dynamique ; aucun ajustement majeur n’est nécessaire ce mois-ci.');
    if(!forts.length) forts.push('La démarche est engagée et le registre a été alimenté ce mois-ci.');

    var brefDelai = c.priseH<=8 ? 'des retours pris en compte rapidement' : 'des retours pris en compte dans des délais corrects';
    return {
      month:MONTH, club:c,
      blocks:[
        {t:'1 · Merci pour votre engagement',
         p:'Merci pour votre engagement ce mois-ci. En utilisant MatSafe Control au quotidien, '+c.name+' fait vivre la démarche d’hygiène du label et contribue à des espaces plus sûrs pour ses pratiquants.'},
        {t:'2 · Votre mois en bref',
         p:c.opsDone+' opérations d’entretien tracées sur '+c.opsPlanned+' prévues, '+c.fighter30+' retour(s) Fighter, '+c.anoClosed30+' anomalie(s) traitée(s) et '+brefDelai+'.'},
        {t:'3 · Points forts', list:forts},
        {t:'4 · Points à consolider', list: consolider.length?consolider:['Aucun axe majeur ce mois-ci — le fonctionnement est maîtrisé.']},
        {t:'5 · Suggestions MATSAFE', list:suggestions},
        {t:'6 · Message de clôture',
         p:'Le label reconnaît le travail déjà accompli : ce bilan sert à maintenir la dynamique, pas à remettre en cause votre statut. MATSAFE reste à vos côtés pour vous accompagner si nécessaire.'}
      ],
      tone:'« Merci pour votre engagement ce mois-ci. Votre registre montre une activité régulière et plusieurs points ont été traités rapidement. '+
           (consolider.length?'Quelques axes peuvent encore être consolidés afin de maintenir cette dynamique. ':'')+
           'MATSAFE reste à vos côtés pour vous accompagner si nécessaire. »'
    };
  }

  function bilanHTML(b, forPrint){
    var body=b.blocks.map(function(bl){
      var inner = bl.list ? '<ul>'+bl.list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' : '<p class="bp">'+esc(bl.p)+'</p>';
      return '<div class="'+(forPrint?'':'bblock')+'"><div class="bt">'+esc(bl.t)+'</div>'+inner+'</div>';
    }).join('');
    var tone = forPrint ? '' : '<div class="tone">Exemple de tonalité retenue : '+esc(b.tone)+'</div>';
    return body+tone;
  }

  var modal=document.getElementById('modal'), modalcard=document.getElementById('modalcard');
  function closeModal(){ modal.classList.remove('on'); scrim.classList.remove('on'); }
  scrim.addEventListener('click', closeModal);

  function openBilan(c){
    var b=genBilan(c);
    modalcard.innerHTML=
      '<div class="ch"><div class="t">Bilan '+esc(b.month)+' — '+esc(c.name)+'</div><button class="cx" id="mx" aria-label="Fermer">×</button></div>'+
      '<div class="cb bilan">'+bilanHTML(b,false)+'</div>'+
      '<div class="cf"><button class="btn ghost sm" id="mclose">Fermer</button><button class="btn sm" id="mprint">Imprimer / PDF</button></div>';
    modal.classList.add('on'); scrim.classList.add('on');
    document.getElementById('mx').onclick=closeModal;
    document.getElementById('mclose').onclick=closeModal;
    document.getElementById('mprint').onclick=function(){
      document.getElementById('printArea').innerHTML=
        '<div class="rp-brand">MATSAFE NETWORK</div><h2>Bilan mensuel — '+esc(b.month)+'</h2>'+
        '<div class="meta">'+esc(c.name)+' · '+esc(c.city)+' · club labellisé MatSafe</div>'+
        bilanHTML(b,true);
      window.print();
    };
  }

  function openEngage(c){
    modalcard.innerHTML=
      '<div class="ch"><div class="t">Engager un échange — '+esc(c.name)+'</div><button class="cx" id="mx" aria-label="Fermer">×</button></div>'+
      '<div class="cb"><p class="bp" style="padding:10px 0">Message proposé au club, dans une posture d’aide (non punitive) :</p>'+
        '<div class="tone" style="font-style:normal">« Nous observons plusieurs remontées sur cette zone. Pouvons-nous vous aider à identifier la cause et à mettre en place une solution durable&nbsp;? »</div>'+
        '<p class="ds" style="margin-top:12px">L’échange est tracé dans l’accompagnement du club. Aucune mesure automatique n’est déclenchée.</p></div>'+
      '<div class="cf"><button class="btn ghost sm" id="mclose">Annuler</button><button class="btn sm" id="msend">Proposer l’échange</button></div>';
    modal.classList.add('on'); scrim.classList.add('on');
    document.getElementById('mx').onclick=closeModal;
    document.getElementById('mclose').onclick=closeModal;
    document.getElementById('msend').onclick=function(){ closeModal(); };
  }

  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeModal(); closeNav(); } });

  go('reseau');
</script>
