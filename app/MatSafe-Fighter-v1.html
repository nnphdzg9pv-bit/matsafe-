<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatSafe Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A; --ink:#0A0A0A; --off:#F2F0EC; --cream:#F2F0EC;
    --paper:#FAF9F5; --paper-2:#ECE9E2;
    --gray:#6F6A60; --faint:#9A9488; --light:#E8E6E1;
    --border:#CFC9BD; --hair:#E0DCD3;
    --ok:#2F6B4F;  --ok-bg:#E6EFE9;
    --warn:#9A5B12; --warn-bg:#F2E8D6;
    --info:#3C4A66; --info-bg:#E4E7EE;
    --brand:#C83830; --brand-strong:#AE2E23;
    --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --sans:"Barlow","Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; font-family:var(--sans); color:var(--ink); background:var(--cream);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden}
  img{max-width:100%}
  [hidden]{display:none!important}
  .app{position:relative; display:flex; flex-direction:column; min-height:100dvh; max-width:520px; margin:0 auto;
    background:var(--cream); border-left:1px solid var(--border); border-right:1px solid var(--border); overflow:hidden}

  /* --- Topbar --- */
  .topbar{flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 18px; border-bottom:1px solid var(--border); background:var(--cream)}
  .brand{display:flex; align-items:center; gap:10px}
  .brand .mark{height:22px; width:auto; display:block}
  .brand .role{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.10em;
    font-size:12px; color:var(--brand); border-left:1px solid var(--border); padding-left:10px}
  .topbar .whoami{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    font-size:11px; color:var(--gray)}

  main{flex:1 1 auto; padding:22px 20px 40px}

  /* --- Club context --- */
  .ctx{border-top:3px solid var(--ink); padding-top:14px; margin-bottom:22px}
  .ctx .eyebrow{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--gray)}
  .ctx h1{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.005em;
    font-size:clamp(28px,8.6vw,40px); line-height:.95; margin:6px 0 4px; overflow-wrap:anywhere}
  .ctx .loc{font-size:13.5px; color:var(--gray)}
  .ctx .zonetag{display:inline-flex; align-items:center; gap:7px; margin-top:11px; font-family:var(--cond);
    font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--ink);
    border:1px solid var(--border); border-radius:999px; padding:6px 12px; background:var(--paper)}
  .zonetag .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}

  .lead{font-size:15.5px; line-height:1.5; color:var(--ink); margin:0 0 20px}
  .lead b{font-weight:600}

  /* --- Big action buttons --- */
  .actions{display:flex; flex-direction:column; gap:13px; margin-bottom:26px}
  .action{display:flex; align-items:center; gap:15px; width:100%; text-align:left; cursor:pointer;
    background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:18px 17px; color:var(--ink)}
  .action:active{transform:translateY(1px)}
  .action .ico{flex:none; width:46px; height:46px; border-radius:12px; display:grid; place-items:center;
    background:var(--cream); border:1px solid var(--border)}
  .action .ico svg{width:24px;height:24px}
  .action.primary{background:var(--black); color:var(--off); border-color:var(--black)}
  .action.primary .ico{background:rgba(242,240,236,.10); border-color:rgba(242,240,236,.22)}
  .action .txt{flex:1 1 auto; min-width:0}
  .action .t{display:block; font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:19px; line-height:1.02}
  .action .d{display:block; font-size:13px; color:var(--gray); margin-top:5px; line-height:1.35}
  .action.primary .d{color:rgba(242,240,236,.72)}
  .action .arr{margin-left:auto; opacity:.55}

  /* --- Info card --- */
  .note{border-top:1px solid var(--hair); padding-top:16px; margin-top:4px}
  .note .h{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--gray); margin-bottom:8px}
  .note p{font-size:12.5px; line-height:1.5; color:var(--gray); margin:0 0 8px}
  .note .pill{display:inline-block; font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    font-size:10.5px; color:var(--ok); background:var(--ok-bg); border-radius:999px; padding:3px 9px; margin:0 5px 5px 0}

  /* --- Recent (local) --- */
  .recent{margin-top:22px}
  .recent .h{font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--gray); margin-bottom:4px}
  .rrow{display:flex; gap:12px; align-items:flex-start; padding:12px 2px; border-top:1px solid var(--hair)}
  .rrow .rt{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:13px}
  .rrow .rs{font-size:12px; color:var(--gray); margin-top:2px}
  .rrow .rk{margin-left:auto; font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:10.5px;
    color:var(--warn); background:var(--warn-bg); border-radius:999px; padding:3px 9px; white-space:nowrap}

  /* --- Form pieces --- */
  .back{display:inline-flex; align-items:center; gap:7px; background:none; border:0; cursor:pointer; color:var(--gray);
    font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:12px; padding:0 0 6px}
  .h2{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.005em; font-size:clamp(26px,8vw,34px); line-height:1; margin:4px 0 6px}
  .sub{font-size:14px; color:var(--gray); line-height:1.45; margin:0 0 22px}
  .field{margin-bottom:20px}
  .field > label{display:block; font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--ink); margin-bottom:9px}
  .field .opt{color:var(--faint); font-weight:600}
  .chips{display:flex; flex-wrap:wrap; gap:9px}
  .chip{font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:13px;
    padding:10px 14px; border-radius:11px; border:1px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink)}
  .chip.sel{background:var(--black); color:var(--off); border-color:var(--black)}
  .feel{display:grid; grid-template-columns:1fr; gap:10px}
  .feelbtn{display:flex; align-items:center; gap:13px; text-align:left; cursor:pointer; color:var(--ink);
    background:var(--paper); border:1px solid var(--border); border-radius:13px; padding:14px 15px}
  .feelbtn .fd{width:14px;height:14px;border-radius:50%;flex:none}
  .feelbtn .ftx{flex:1 1 auto; min-width:0}
  .feelbtn .ft{display:block; font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:16px}
  .feelbtn .fs{display:block; font-size:12px; color:var(--gray); margin-top:2px}
  .feelbtn.sel{background:var(--black); color:var(--off); border-color:var(--black)}
  .feelbtn.sel .fs{color:rgba(242,240,236,.72)}
  textarea,input[type=text]{width:100%; font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--paper);
    border:1px solid var(--border); border-radius:11px; padding:12px 13px; resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--black); outline-offset:1px}
  .photo{display:flex; align-items:center; gap:13px}
  .photobtn{display:inline-flex; align-items:center; gap:9px; font-family:var(--cond); font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; font-size:13px; padding:11px 15px; border-radius:11px; border:1px dashed var(--border); background:var(--paper); cursor:pointer; color:var(--ink)}
  .photo img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .photo .rm{background:none;border:0;color:var(--brand);font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:11px;cursor:pointer}

  .cta{position:sticky; bottom:0; margin:24px -20px 0; padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(242,240,236,0),var(--cream) 26%); }
  .btn{width:100%; font-family:var(--cond); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:16px;
    padding:16px; border-radius:13px; border:1px solid var(--black); background:var(--black); color:var(--off); cursor:pointer}
  .btn[disabled]{opacity:.4; cursor:not-allowed}
  .btn.ghost{background:transparent; color:var(--ink)}

  /* --- Done screen --- */
  .done{min-height:70dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 6px}
  .done .ring{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);border:2px solid var(--ok);margin-bottom:18px}
  .done .ring svg{width:38px;height:38px;color:var(--ok)}
  .done h2{font-family:var(--cond); font-weight:900; text-transform:uppercase; letter-spacing:.005em; font-size:32px; line-height:1; margin:0 0 10px}
  .done p{font-size:14.5px; line-height:1.5; color:var(--gray); max-width:340px; margin:0 0 8px}
  .done .again{margin-top:20px}

  .foot{margin-top:30px; padding-top:16px; border-top:1px solid var(--hair); font-size:11px; color:var(--faint); line-height:1.5}
  .foot b{color:var(--gray); font-weight:600}

  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px); z-index:60; background:var(--black); color:var(--off);
    font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:13px; padding:12px 18px; border-radius:11px;
    opacity:0; pointer-events:none; transition:.28s}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== DA MatSafe Club : memes couleurs, typo Archivo+Inter, angles nets ===== */
:root{
  --cream:#F1F0EC;--off:#F1F0EC;--paper:#F7F5F0;--paper-2:#ECEBE4;
  --black:#0B0B0B;--ink:#0B0B0B;
  --gray:#5A5351;--faint:#9A968E;--light:#E1DFD6;
  --border:#D3D1C7;--hair:#E1DFD6;
  --brand:#D0402C;--brand-strong:#B7351F;
  --ok:#3E8E4F;--ok-bg:#E7EFE4;--warn:#B87A2C;--warn-bg:#F1EBDD;--info:#4A5566;--info-bg:#E7E8E2;
  --cond:'Archivo','Inter',system-ui,sans-serif;
  --sans:'Inter',system-ui,sans-serif;
}
.zonetag,.note .pill,.rrow .rk,.action,.action .ico,.chip,.feelbtn,textarea,input[type=text],.photobtn,.photo img,.btn,.btn-secondary{border-radius:6px}
.topbar .brandlogo{height:60px;width:auto;max-width:100%;display:block}
.topbar{align-items:center}
/* ===== Message du club (émis depuis MATSAFE Club) ===== */
.clubmsg{margin:0;padding:16px 20px;background:var(--paper);border-bottom:1px solid var(--border);border-left:4px solid var(--brand)}
.clubmsg .k{display:flex;align-items:center;gap:7px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:var(--brand);margin-bottom:7px}
.clubmsg .k .d{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.clubmsg h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.01em;font-weight:800;font-size:16px;margin:0 0 5px;color:var(--ink)}
.clubmsg p{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0;white-space:pre-wrap}
/* ===== Avis — accroche éditoriale (grand titre centré) ===== */
.avis-hero{text-align:center;padding:22px 6px 30px}
.avis-title{font-family:var(--cond);font-weight:700;text-transform:none;letter-spacing:-.015em;font-size:clamp(34px,10vw,46px);line-height:1.02;color:var(--ink);margin:0}
.avis-lead{max-width:32ch;margin:16px auto 0;color:var(--gray);font-size:14.5px;line-height:1.55}
</style>

<script>
"use strict";
/* =====================================================================
   MATSAFE FIGHTER — interface pratiquant (accès QR)
   Principe (cf. Architecture MATSAFE) : le pratiquant n'administre rien.
   Il donne un RESSENTI hygiène ou envoie un SIGNALEMENT.
   Ce n'est PAS une plateforme de notation ni de réclamation.
   Un signalement part vers MATSAFE Control avec le statut
   « Signalement Fighter — à vérifier ». Le pratiquant ne crée jamais
   de non-conformité. Aucune donnée personnelle/médicale n'est demandée.
   ===================================================================== */

  var STORE='matsafe_fighter_v1';       // historique local (démo, ce téléphone)
  var INBOX='matsafe_fighter_inbox';    // file partagée que Control lirait (même origine)

  // Zones proposées (alignées sur les zones type d'un club)
  var ZONES=['Tatami / surface de combat','Vestiaires','Douches','Sanitaires',
             'Zone premiers secours','Matériel partagé','Accueil / commun','Autre'];
  // Catégories d'un signalement (jamais une "note")
  var CATS=[
    {id:'proprete',   t:'Propreté d’une zone'},
    {id:'sanitaires', t:'Sanitaires / vestiaires'},
    {id:'douches',    t:'Douches'},
    {id:'materiel',   t:'Matériel ou équipement'},
    {id:'consommable',t:'Consommable manquant'},
    {id:'premiers',   t:'Premiers secours'},
    {id:'autre',      t:'Autre'}
  ];
  var FEELINGS=[
    {id:'clean', t:'Propre et agréable',  s:'Rien à signaler aujourd’hui', c:'var(--ok)'},
    {id:'ok',    t:'Correct',             s:'Convenable, sans plus',        c:'var(--warn)'},
    {id:'improve',t:'Peut être amélioré', s:'J’ai remarqué un point à revoir', c:'var(--brand)'}
  ];

  /* --- Contexte club : simulé via QR (hash #c=CODE&n=Nom&v=Ville&z=Zone) --- */
  function ctxFromQR(){
    var h={}; try{
      (location.hash||'').replace(/^#/,'').split('&').forEach(function(p){
        var i=p.indexOf('='); if(i>0) h[decodeURIComponent(p.slice(0,i))]=decodeURIComponent(p.slice(i+1));
      });
    }catch(e){}
    return {
      code: h.c || 'CFC-PARIS-01',
      club: h.n || 'Cube Fight Club',
      city: h.v || 'Paris',
      zone: h.z || ''    // si le QR est posé sur une zone précise (ex. QR douches)
    };
  }
  var CTX=ctxFromQR();

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function pad(n){return n<10?'0'+n:''+n;}
  function nowStamp(){var d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' · '+pad(d.getHours())+':'+pad(d.getMinutes());}
  function uid(){return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return [];}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  function submit(rec){
    rec.id=uid(); rec.club=CTX.club; rec.clubCode=CTX.code; rec.ts=Date.now();
    rec.status='to_verify';                       // « Signalement Fighter — à vérifier »
    var mine=load(STORE); mine.unshift(rec); save(STORE, mine.slice(0,20));
    var inbox=load(INBOX); inbox.unshift(rec); save(INBOX, inbox.slice(0,200));  // vers Control (même origine)
  }

  var toastT;
  function toast(m){var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');},1900);}

  /* petites icônes inline */
  var IChat='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>';
  var IFlag='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';
  var IArr='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  var IBack='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
  var ICam='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
  var ICheck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  /* --- photo : compression canvas -> JPEG dataURL (comme Control) --- */
  function pickPhoto(cb){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
    inp.onchange=function(){var f=inp.files&&inp.files[0]; if(!f){cb(null);return;}
      var r=new FileReader(); r.onload=function(){var img=new Image(); img.onload=function(){
        var mx=1024, w=img.width, h=img.height; if(w>h && w>mx){h=Math.round(h*mx/w); w=mx;} else if(h>mx){w=Math.round(w*mx/h); h=mx;}
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
        try{cb(cv.toDataURL('image/jpeg',0.7));}catch(e){cb(null);}
      }; img.onerror=function(){cb(null);}; img.src=r.result;}; r.readAsDataURL(f);};
    inp.click();
  }

  var view=document.getElementById('view');
  document.getElementById('whoami').textContent='Retour anonyme';

  /* ======================= ÉCRANS ======================= */
  function screenHome(){
    var mine=load(STORE);
    var zoneTag = CTX.zone ? '<span class="zonetag"><span class="dot"></span>'+esc(CTX.zone)+'</span>' : '';
    var recent='';
    if(mine.length){
      recent='<div class="recent"><div class="h">Vos derniers retours (sur ce téléphone)</div>'+
        mine.slice(0,3).map(function(r){
          var label = r.kind==='avis' ? 'Avis hygiène' : 'Signalement';
          var sub = r.kind==='avis' ? (feelOf(r.feeling)||'') : (catOf(r.cat)||'');
          if(r.zone) sub += (sub?' · ':'')+r.zone;
          return '<div class="rrow"><div><div class="rt">'+esc(label)+'</div><div class="rs">'+esc(sub)+' · '+esc(r.when||'')+'</div></div>'+
                 '<span class="rk">Transmis</span></div>';
        }).join('')+'</div>';
    }
    view.innerHTML=
      '<div class="ctx"><div class="eyebrow">Vous êtes chez</div>'+
        '<h1>'+esc(CTX.club)+'</h1><div class="loc">'+esc(CTX.city)+' · Club labellisé MatSafe</div>'+zoneTag+'</div>'+
      '<p class="lead">Votre retour aide le club à garder un espace <b>propre et sûr</b>. '+
        'C’est <b>anonyme</b>, en quelques secondes.</p>'+
      '<div class="actions">'+
        '<button class="action primary" id="a-avis"><span class="ico">'+IChat+'</span>'+
          '<span class="txt"><span class="t">Donner mon avis hygiène</span><span class="d">Votre ressenti sur la propreté du jour</span></span>'+
          '<span class="arr">'+IArr+'</span></button>'+
        '<button class="action" id="a-signal"><span class="ico">'+IFlag+'</span>'+
          '<span class="txt"><span class="t">Signaler un point à améliorer</span><span class="d">Un détail à revoir ? Dites-le au club</span></span>'+
          '<span class="arr">'+IArr+'</span></button>'+
      '</div>'+
      '<div class="note"><div class="h">Comment ça marche</div>'+
        '<p>Vos retours arrivent directement au club, qui les vérifie et agit si besoin. '+
        'MatSafe Fighter n’est <b>ni une note publique ni un classement</b> : c’est un canal d’amélioration.</p>'+
        '<span class="pill">Anonyme</span><span class="pill">Sans compte</span><span class="pill">Aucune donnée médicale</span>'+
      '</div>'+
      recent+
      '<div class="foot"><b>MATSAFE Fighter</b> — canal de retour terrain de l’écosystème MatSafe '+
      '(Control · Fighter · Fondateur). Le club reste responsable du traitement de chaque retour.</div>';
    document.getElementById('a-avis').onclick=screenAvis;
    document.getElementById('a-signal').onclick=screenSignal;
  }
  function feelOf(id){var f=FEELINGS.filter(function(x){return x.id===id;})[0];return f?f.t:'';}
  function catOf(id){var c=CATS.filter(function(x){return x.id===id;})[0];return c?c.t:'';}

  function backBtn(){var b='<button class="back" id="back">'+IBack+' Retour</button>'; return b;}
  function wireBack(){var b=document.getElementById('back'); if(b) b.onclick=screenHome;}

  /* --- AVIS HYGIÈNE (ressenti, non une note publique) --- */
  function screenAvis(){
    var st={feeling:null, zone:'', comment:''};
    view.innerHTML=
      backBtn()+
      '<div class="avis-hero"><h2 class="avis-title">Comment c’était<br>aujourd’hui&nbsp;?</h2>'+
      '<p class="avis-lead">Votre ressenti sur l’hygiène du club. Anonyme, en quelques secondes — et ça aide vraiment.</p></div>'+
      '<div class="field"><label>Votre ressenti</label><div class="feel" id="feel">'+
        FEELINGS.map(function(f){return '<button class="feelbtn" data-f="'+f.id+'"><span class="fd" style="background:'+f.c+'"></span>'+
          '<span class="ftx"><span class="ft">'+esc(f.t)+'</span><span class="fs">'+esc(f.s)+'</span></span></button>';}).join('')+
      '</div></div>'+
      '<div class="field"><label>Zone concernée <span class="opt">— optionnel</span></label>'+
        '<div class="chips" id="zones">'+ZONES.map(function(z){return '<button class="chip" data-z="'+esc(z)+'">'+esc(z)+'</button>';}).join('')+'</div></div>'+
      '<div class="field"><label>Un mot pour préciser <span class="opt">— optionnel</span></label>'+
        '<textarea id="cmt" rows="3" maxlength="400" placeholder="Ex. : tatami nickel ce soir / vestiaire un peu humide…"></textarea></div>'+
      '<div class="cta"><button class="btn" id="send" disabled>Envoyer mon avis</button></div>';
    wireBack();
    if(CTX.zone) st.zone=CTX.zone;
    var send=document.getElementById('send');
    function refresh(){send.disabled = !st.feeling;}
    document.getElementById('feel').querySelectorAll('.feelbtn').forEach(function(b){
      b.onclick=function(){document.querySelectorAll('#feel .feelbtn').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); st.feeling=b.dataset.f; refresh();};
    });
    document.getElementById('zones').querySelectorAll('.chip').forEach(function(b){
      if(CTX.zone && b.dataset.z===CTX.zone) b.classList.add('sel');
      b.onclick=function(){var on=b.classList.contains('sel'); document.querySelectorAll('#zones .chip').forEach(function(x){x.classList.remove('sel');}); if(!on){b.classList.add('sel'); st.zone=b.dataset.z;} else st.zone='';};
    });
    document.getElementById('cmt').oninput=function(){st.comment=this.value.trim();};
    send.onclick=function(){
      submit({kind:'avis', feeling:st.feeling, zone:st.zone, description:st.comment, cat:null, photo:null, when:nowStamp()});
      screenDone('avis');
    };
  }

  /* --- SIGNALEMENT --- */
  function screenSignal(){
    var st={cat:null, zone:CTX.zone||'', description:'', photo:null};
    view.innerHTML=
      backBtn()+
      '<h2 class="h2">Signaler</h2>'+
      '<p class="sub">Un point à améliorer ? Décrivez-le simplement. Le club le vérifiera et le traitera — vous ne créez pas de non-conformité, juste une info utile.</p>'+
      '<div class="field"><label>De quoi s’agit-il ?</label><div class="chips" id="cats">'+
        CATS.map(function(c){return '<button class="chip" data-c="'+c.id+'">'+esc(c.t)+'</button>';}).join('')+'</div></div>'+
      '<div class="field"><label>Zone concernée</label><div class="chips" id="zones">'+
        ZONES.map(function(z){return '<button class="chip" data-z="'+esc(z)+'">'+esc(z)+'</button>';}).join('')+'</div></div>'+
      '<div class="field"><label>Description</label>'+
        '<textarea id="desc" rows="4" maxlength="600" placeholder="Ex. : plus de savon au lavabo de droite dans le vestiaire."></textarea></div>'+
      '<div class="field"><label>Photo <span class="opt">— optionnel</span></label>'+
        '<div class="photo" id="photo"><button class="photobtn" id="addphoto">'+ICam+' Ajouter une photo</button></div></div>'+
      '<div class="cta"><button class="btn" id="send" disabled>Envoyer au club</button></div>';
    wireBack();
    var send=document.getElementById('send');
    function refresh(){send.disabled = !(st.cat && st.zone && st.description.length>2);}
    document.getElementById('cats').querySelectorAll('.chip').forEach(function(b){
      b.onclick=function(){document.querySelectorAll('#cats .chip').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); st.cat=b.dataset.c; refresh();};
    });
    document.getElementById('zones').querySelectorAll('.chip').forEach(function(b){
      if(st.zone && b.dataset.z===st.zone) b.classList.add('sel');
      b.onclick=function(){document.querySelectorAll('#zones .chip').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); st.zone=b.dataset.z; refresh();};
    });
    document.getElementById('desc').oninput=function(){st.description=this.value.trim(); refresh();};
    document.getElementById('addphoto').onclick=function(){
      pickPhoto(function(data){ if(!data){toast('Photo non ajoutée'); return;} st.photo=data; drawPhoto(); });
    };
    function drawPhoto(){
      var box=document.getElementById('photo');
      box.innerHTML='<img alt="aperçu" src="'+st.photo+'"><button class="rm" id="rmph">Retirer</button>'+
        '<button class="photobtn" id="addphoto2">'+ICam+' Remplacer</button>';
      document.getElementById('rmph').onclick=function(){st.photo=null; box.innerHTML='<button class="photobtn" id="addphoto">'+ICam+' Ajouter une photo</button>'; document.getElementById('addphoto').onclick=function(){pickPhoto(function(d){if(d){st.photo=d; drawPhoto();}});};};
      document.getElementById('addphoto2').onclick=function(){pickPhoto(function(d){if(d){st.photo=d; drawPhoto();}});};
    }
    send.onclick=function(){
      submit({kind:'signal', cat:st.cat, zone:st.zone, description:st.description, photo:st.photo, feeling:null, when:nowStamp()});
      screenDone('signal');
    };
  }

  /* --- CONFIRMATION --- */
  function screenDone(kind){
    var msg = kind==='avis'
      ? 'Votre avis a bien été transmis au club. Merci d’aider <b>'+esc(CTX.club)+'</b> à garder un espace sain.'
      : 'Votre signalement est arrivé au club avec le statut <b>« à vérifier »</b>. Il sera pris en compte et traité si nécessaire.';
    view.innerHTML=
      '<div class="done">'+
        '<div class="ring">'+ICheck+'</div>'+
        '<h2>Merci&nbsp;!</h2>'+
        '<p>'+msg+'</p>'+
        '<p>Aucun compte, aucune donnée personnelle : votre retour reste anonyme.</p>'+
        '<div class="again"><button class="btn ghost" id="again" style="width:auto;padding:14px 26px">Faire un autre retour</button></div>'+
      '</div>';
    document.getElementById('again').onclick=screenHome;
    toast('Retour transmis');
  }

  screenHome();
</script>
<script>
/* Message du club : lu depuis localStorage (publié par MATSAFE Club, même origine). */
(function(){
  var K='matsafe_club_message';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var box=document.getElementById('clubMsg'); if(!box)return;
  function render(){
    var m=null; try{var r=localStorage.getItem(K); m=r?JSON.parse(r):null;}catch(e){}
    if(m&&m.body){
      box.innerHTML='<div class="k"><span class="d"></span>Message du club</div>'+(m.title?'<h3>'+esc(m.title)+'</h3>':'')+'<p>'+esc(m.body)+'</p>';
      box.hidden=false;
    } else { box.hidden=true; box.innerHTML=''; }
  }
  render();
  window.addEventListener('storage', function(e){ if(e.key===K) render(); });
})();
</script>
